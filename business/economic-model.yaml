model_id: v1-ind-v2-business-sensitivity
model_version: "0.1"
cost_unit: manual_review_equivalent_unit
compared_modes:
  - V1-ind
  - V2
assumptions:
  - One REU is the internal cost of one standard manual review; it is not a currency amount.
  - The share of dangerous proposals is an external scenario assumption, not the dangerous/admissible balance of the evaluation catalog.
  - A dangerous ACCEPT incurs escaped-change cost; a dangerous REJECT prevents that cost.
  - NEEDS_REVIEW incurs review cost and is assumed to resolve before release; downstream incident cost is not added to the same proposal.
  - An admissible REJECT incurs delay and rework cost; an admissible NEEDS_REVIEW incurs review cost only.
  - Fixed mode cost is an incremental scenario input for ownership and operation during the modeled period.
  - Latency of the in-process prototype is not converted into money because it is not production process time.
scenarios:
  - scenario_id: low
    label: Low-impact
    description: Low prevalence and low consequence of dangerous changes.
    proposal_count: 100
    dangerous_change_share: 0.01
    escaped_dangerous_change_cost_reu: 5.0
    false_reject_cost_reu: 0.25
    manual_review_cost_reu: 1.0
    fixed_cost_reu_by_mode:
      V1-ind: 0.0
      V2: 20.0
  - scenario_id: base
    label: Base
    description: Moderate prevalence and consequence of dangerous changes.
    proposal_count: 100
    dangerous_change_share: 0.05
    escaped_dangerous_change_cost_reu: 50.0
    false_reject_cost_reu: 1.0
    manual_review_cost_reu: 1.0
    fixed_cost_reu_by_mode:
      V1-ind: 0.0
      V2: 20.0
  - scenario_id: high
    label: High-impact
    description: Higher prevalence and high consequence of dangerous changes.
    proposal_count: 100
    dangerous_change_share: 0.15
    escaped_dangerous_change_cost_reu: 200.0
    false_reject_cost_reu: 3.0
    manual_review_cost_reu: 1.0
    fixed_cost_reu_by_mode:
      V1-ind: 0.0
      V2: 20.0
