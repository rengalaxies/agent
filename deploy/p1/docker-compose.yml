# Development-only deployment example. UI and core live on SEPARATE VMs in Cloud.ru.
# Do not use as a single-host production topology.
services:
  core-demo:
    build:
      context: ../..
      dockerfile: services/Dockerfile.demo
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8000:8000"
  ui-demo:
    build:
      context: ../..
      dockerfile: ui/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8080:8080"
