name: Lab pinned SSH exact source delivery staging only
# Qualify OS network/firewall and privileged read-only runtime after pinned SSH access.
on:
  workflow_dispatch:
  push:
    branches: [feat/postgres-rabbitmq-agent-lab]
    paths:
      - infra/cloudru/lab/stage_release.py
      - infra/cloudru/lab/ui-host-pin.json
      - .github/workflows/lab-source-delivery.yml
permissions:
  contents: read
concurrency:
  group: cloudru-daniil-p1-deployment
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 107dfd14292a5ab06593d424bf0b94f1cccb0b90
          fetch-depth: 0
          persist-credentials: false
          path: release-source
      - name: Create self-contained exact-source bundle on runner
        run: |
          git -C release-source bundle create "$RUNNER_TEMP/release.bundle" HEAD
          echo "RELEASE_BUNDLE=$RUNNER_TEMP/release.bundle" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Configure official Terraform mirror
        run: |
          cat > "$RUNNER_TEMP/cloudru.tfrc" <<'EOF'
          provider_installation {
            network_mirror {
              url = "https://evo-tf-provider-generic.ar.cloud.ru/"
              include = ["cloudru/*"]
            }
            direct { exclude = ["cloudru/*"] }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/cloudru.tfrc" >> "$GITHUB_ENV"
      - name: Install state and API clients
        run: python3 -m pip install --quiet boto3==1.40.50 requests==2.32.5 cryptography==46.0.3 paramiko==3.5.1
      - name: Stage verified source without services or SQL
        env:
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          CLOUDRU_STATE_SSE_CUSTOMER_KEY: ${{ secrets.CLOUDRU_STATE_SSE_CUSTOMER_KEY }}
          CLOUDRU_STATE_ACCESS_KEY_ID: ${{ secrets.CLOUDRU_STATE_ACCESS_KEY_ID }}
          CLOUDRU_STATE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDRU_STATE_SECRET_ACCESS_KEY }}
          CLOUDRU_SSH_PUBLIC_KEY: ${{ secrets.CLOUDRU_SSH_PUBLIC_KEY }}
          CLOUDRU_UI_BASIC_AUTH_HASH: ${{ secrets.CLOUDRU_UI_BASIC_AUTH_HASH }}
          CLOUDRU_LAB_SSH_KNOWN_HOSTS: ${{ secrets.CLOUDRU_LAB_SSH_KNOWN_HOSTS }}
        run: python3 infra/cloudru/lab/stage_scoped.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-source-delivery-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            lab-source-delivery.json
            lab-scoped-ssh.json
          if-no-files-found: error
          retention-days: 14
