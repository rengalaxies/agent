name: Cloud.ru managed hosting verification
on:
  workflow_dispatch:
  push:
    branches: ["deploy/cloudru-managed"]
    paths: ["Dockerfile", "services/managed_app.py", ".github/workflows/cloudru-managed-test.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build managed application
        run: docker build -t dmrp-managed:test .
      - name: Verify authentication, readiness and real PostgreSQL persistence
        run: |
          python3 - <<'PY'
          import subprocess,os,secrets,hashlib,time,json
          import requests
          def docker(*args):
              return subprocess.run(["docker",*args],check=True,capture_output=True,text=True).stdout.strip()
          network="dmrp-managed-test"
          password=secrets.token_hex(24)
          dbpass=secrets.token_hex(24)
          env=os.environ.copy()
          env.update(DMRP_UI_USERNAME="researcher",DMRP_UI_PASSWORD_SHA256=hashlib.sha256(password.encode()).hexdigest(),DATABASE_URL="postgresql://dmrp:"+dbpass+"@database:5432/dmrp",POSTGRES_PASSWORD=dbpass)
          def run(*args):
              return subprocess.run(["docker",*args],env=env,check=True,capture_output=True,text=True).stdout.strip()
          auth=("researcher",password)
          base="http://127.0.0.1:18080"
          try:
              docker("network","create",network)
              run("run","-d","--name","managed-no-db","--network",network,"-p","127.0.0.1:18080:8080","-e","DMRP_UI_USERNAME","-e","DMRP_UI_PASSWORD_SHA256","dmrp-managed:test")
              for attempt in range(40):
                  try:
                      r=requests.get(base+"/healthz",timeout=2)
                      break
                  except requests.RequestException: time.sleep(1)
              else: raise AssertionError("Application did not start")
              assert r.status_code==503, "Missing DB must fail readiness"
              assert requests.get(base,timeout=5).status_code==401
              assert requests.get(base,headers={"Authorization":"Basic !!!"},timeout=5).status_code==401
              assert requests.get(base,auth=auth,timeout=5).status_code==200
              assert requests.post(base+"/api/v1/demo/runs",auth=auth,data="x"*8193,timeout=5).status_code==413
              print("PASS: UI authentication, request limit and missing-DB readiness")
              docker("rm","-f","managed-no-db")
              run("run","-d","--name","managed-db","--network",network,"--network-alias","database","-e","POSTGRES_USER=dmrp","-e","POSTGRES_DB=dmrp","-e","POSTGRES_PASSWORD","postgres:16-alpine")
              for attempt in range(40):
                  p=subprocess.run(["docker","exec","managed-db","pg_isready","-U","dmrp","-d","dmrp"],capture_output=True)
                  if p.returncode==0: break
                  time.sleep(1)
              else: raise AssertionError("PostgreSQL did not start")
              run("run","-d","--name","managed-app","--network",network,"--read-only","--tmpfs","/tmp:rw,nosuid,nodev,size=128m","--cap-drop","ALL","--security-opt","no-new-privileges","-p","127.0.0.1:18080:8080","-e","DMRP_UI_USERNAME","-e","DMRP_UI_PASSWORD_SHA256","-e","DATABASE_URL","dmrp-managed:test")
              for attempt in range(40):
                  try:
                      if requests.get(base+"/healthz",timeout=3).status_code==200: break
                  except requests.RequestException: pass
                  time.sleep(1)
              else: raise AssertionError("Application readiness failed")
              assert requests.get(base+"/api/healthz",auth=auth,timeout=5).status_code==200
              r=requests.get(base+"/api/v1/demo/scenarios",auth=auth,timeout=5)
              r.raise_for_status()
              scenario=r.json()["scenarios"][0]["id"]
              r=requests.post(base+"/api/v1/demo/runs",auth=auth,json={"scenario_id":scenario},timeout=15)
              r.raise_for_status()
              assert r.json()["audit"]["persisted"] is True
              count=docker("exec","managed-db","psql","-U","dmrp","-d","dmrp","-tAc","SELECT count(*) FROM demo_release_audit")
              assert count=="1"
              print("PASS: authenticated API, V2 engine and persisted PostgreSQL audit")
          finally:
              for name in ("managed-no-db","managed-app","managed-db"):
                  subprocess.run(["docker","rm","-f",name],capture_output=True)
              subprocess.run(["docker","network","rm",network],capture_output=True)
          PY
