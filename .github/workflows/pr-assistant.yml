name: PR change assistant batches 1-3
on:
  push:
    branches: [research/pr-change-assistant]
    paths:
      - '.github/workflows/pr-assistant.yml'
      - 'src/datamesh_release_protocol/dependency_import.py'
      - 'src/datamesh_release_protocol/change_assistant.py'
      - 'tests/test_pr_assistant.py'
      - 'tools/*pr_assistant.py'
      - 'tools/check_dependency_import.py'
      - 'tools/check_real_dbt_manifest.py'
      - 'examples/pr-assistant/**'
      - 'docs/research-2026-10-15/*import-results.json'
      - 'docs/research-2026-10-15/pr-assistant*'
      - 'docs/research-2026-10-15/pr-assistant-demo/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: 'src:tests:tools'
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[distributed]'
      - name: Existing guarantees and new imports, PR flow and comparisons
        run: python -m unittest test_pr_assistant test_evidence_snapshot test_migration_evidence test_evidence_graph test_consumer_test_baseline test_knowledge -v
      - name: Reproduce new diagnostics and complete review artifacts
        run: |
          python tools/check_dependency_import.py --output /tmp/import-results.json
          diff docs/research-2026-10-15/dependency-import-results.json /tmp/import-results.json
          python tools/compare_pr_assistant.py --output /tmp/pr-assistant-comparison.json
          diff docs/research-2026-10-15/pr-assistant-comparison.json /tmp/pr-assistant-comparison.json
          python tools/run_pr_assistant.py --output /tmp/pr-assistant-review
          diff -r docs/research-2026-10-15/pr-assistant-demo /tmp/pr-assistant-review
          python tools/run_equal_information.py > /tmp/equal-information.json
          diff docs/research-2026-10-15/equal-information-results.json /tmp/equal-information.json
          python tools/run_migration_evidence_demo.py > /tmp/migration-evidence.json
          diff docs/research-2026-10-15/migration-evidence-results.json /tmp/migration-evidence.json
          python tools/run_evidence_snapshot_demo.py > /tmp/evidence-snapshot.json
          diff docs/research-2026-10-15/evidence-snapshot-results.json /tmp/evidence-snapshot.json
      - name: Install isolated dbt integration environment
        run: |
          python -m venv /tmp/dbt-integration
          /tmp/dbt-integration/bin/python -m pip install 'dbt-core>=1.10,<1.12' 'dbt-duckdb>=1.10,<1.11'
          /tmp/dbt-integration/bin/python -m pip freeze > /tmp/dbt-dependencies.txt
      - name: Generate an actual dbt manifest and check imported graph
        run: |
          /tmp/dbt-integration/bin/dbt parse --no-partial-parse --project-dir examples/pr-assistant/dbt --profiles-dir examples/pr-assistant/dbt
          python tools/check_real_dbt_manifest.py --manifest examples/pr-assistant/dbt/target/manifest.json --output /tmp/real-dbt-import.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batches-1-3-audit-evidence
          path: |
            /tmp/pr-assistant-review
            /tmp/pr-assistant-comparison.json
            /tmp/import-results.json
            /tmp/real-dbt-import.json
            /tmp/dbt-dependencies.txt
            examples/pr-assistant/dbt/target/manifest.json
