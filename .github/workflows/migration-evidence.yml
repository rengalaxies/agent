name: Executable migration evidence
on:
  push:
    branches: [research/executable-migration-evidence]
    paths:
      - '.github/workflows/migration-evidence.yml'
      - 'src/datamesh_release_protocol/migration_evidence.py'
      - 'tests/test_migration_evidence.py'
      - 'tools/run_migration_evidence_demo.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[distributed]'
      - name: Verify evidence, graph and legacy knowledge behavior
        env:
          PYTHONPATH: 'src:tests'
        run: |
          python -m unittest discover -s tests -p 'test_migration_evidence.py' -v
          python -m unittest discover -s tests -p 'test_evidence_graph.py' -v
          python -m unittest discover -s tests -p 'test_consumer_test_baseline.py' -v
          python -m unittest discover -s tests -p 'test_knowledge.py' -v
      - name: Reproduce diagnostics exactly
        env:
          PYTHONPATH: src
        run: |
          python tools/run_migration_evidence_demo.py > /tmp/migration-evidence.json
          diff docs/research-2026-10-15/migration-evidence-results.json /tmp/migration-evidence.json
          python tools/run_equal_information.py > /tmp/equal-information.json
          diff docs/research-2026-10-15/equal-information-results.json /tmp/equal-information.json
      - uses: actions/upload-artifact@v4
        with:
          name: migration-evidence-diagnostic
          path: /tmp/migration-evidence.json
