name: Cloud.ru deployment validation (no apply)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/cloudru/deploy/**'
      - '.github/workflows/cloudru-deployment-check.yml'
permissions:
  contents: write
  issues: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Set official Cloud.ru provider mirror
        run: |
          cat > "$RUNNER_TEMP/terraform.tfrc" <<'EOF'
          provider_installation {
            network_mirror {
              url = "https://evo-tf-provider-generic.ar.cloud.ru/"
              include = ["cloudru/*"]
            }
            direct {
              exclude = ["cloudru/*"]
            }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/terraform.tfrc" >> "$GITHUB_ENV"
      - name: Validate deployment syntax and provider schema
        working-directory: infra/cloudru/deploy
        run: |
          set +e
          terraform init -backend=false -input=false > /tmp/cloud-init.log 2>&1
          init_rc=$?
          if [ "$init_rc" -eq 0 ]; then
            terraform fmt > /tmp/cloud-fmt.log 2>&1
            terraform validate -no-color > /tmp/cloud-validate.log 2>&1
            validate_rc=$?
          else
            validate_rc=99
          fi
          export INIT_RC="$init_rc" VALIDATE_RC="$validate_rc"
          python3 - <<'PY'
          import json,os,pathlib,re
          init=pathlib.Path("/tmp/cloud-init.log").read_text() if pathlib.Path("/tmp/cloud-init.log").exists() else ""
          val=pathlib.Path("/tmp/cloud-validate.log").read_text() if pathlib.Path("/tmp/cloud-validate.log").exists() else ""
          # Include only schema errors, not provider environment or credentials.
          errors=[line.strip() for line in val.splitlines() if "Error:" in line or "Unsupported" in line]
          state={
            "status":"passed" if os.environ["INIT_RC"]=="0" and os.environ["VALIDATE_RC"]=="0" else "failed",
            "stage":"init" if os.environ["INIT_RC"]!="0" else "validate",
            "run_id":os.environ.get("GITHUB_RUN_ID",""),
            "commit_sha":os.environ.get("GITHUB_SHA",""),
            "validation_errors":errors[:20],
            "notes":"Read-only Terraform syntax/schema validation; no apply"
          }
          if state["stage"]=="init" and state["status"]=="failed":
            state["validation_errors"]=["Provider installation/init failed; inspect GitHub Actions job logs"]
          out=pathlib.Path("../../../docs/launch-2026-10/cloudru-deployment-validation.json")
          out.write_text(json.dumps(state,ensure_ascii=False,indent=2))
          print(json.dumps(state,ensure_ascii=False))
          PY
          exit 0
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudru-schema-validation
          path: docs/launch-2026-10/cloudru-deployment-validation.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish safe validation result
        if: always()
        continue-on-error: true
        run: |
          git config user.name "cloudru-validation-bot"
          git config user.email "cloudru-validation-bot@users.noreply.github.com"
          git add docs/launch-2026-10/cloudru-deployment-validation.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update Terraform schema validation result [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main || echo "Report push unavailable; diagnostic artifact is retained."
          fi
      - name: Publish validation status to GitHub Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("docs/launch-2026-10/cloudru-deployment-validation.json")
          data=json.loads(p.read_text()) if p.exists() else {"status":"failed","stage":"reporting","validation_errors":["No validation report produced"]}
          lines=[
             "# Cloud.ru deployment validation status",
             "",
             "**Project scope:** 20853297-65b7-42a8-af40-25c8d2df4e11",
             "**Status:** "+str(data.get("status")),
             "**Stage:** "+str(data.get("stage")),
             "**Run:** "+str(data.get("run_id") or "unknown"),
             "**Commit:** "+str(data.get("commit_sha") or "unknown"),
             "",
             "## Sanitized errors"
          ]
          lines += ["- "+str(e)[:500] for e in data.get("validation_errors",[])][:20] or ["- None"]
          lines += ["","Only schema validation. No terraform apply is executed."]
          pathlib.Path("/tmp/cloudru-status.md").write_text("\\n".join(lines))
          PY
          TITLE="[Cloud.ru CI] Terraform deployment status"
          ISSUE=$(gh issue list --repo "$GH_REPO" --state open --json number,title --jq '.[] | select(.title == "[Cloud.ru CI] Terraform deployment status") | .number' | head -1)
          if [ -z "$ISSUE" ]; then
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file /tmp/cloudru-status.md
          else
            gh issue edit "$ISSUE" --repo "$GH_REPO" --body-file /tmp/cloudru-status.md
          fi
      - name: Mark validation failure
        if: always()
        run: |
          python3 - <<'PY'
          import json,sys
          data=json.load(open("docs/launch-2026-10/cloudru-deployment-validation.json"))
          sys.exit(0 if data["status"]=="passed" else 1)
          PY
