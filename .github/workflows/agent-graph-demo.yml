name: HTTP graph demo
on:
  pull_request:
    paths:
      - 'src/agent_graph/**'
      - 'src/agent_graph_demo/**'
      - 'constitutions/agent-service-v1.yaml'
      - 'examples/agent_graph_demo/**'
      - 'tools/agent_graph_demo/**'
      - 'infra/agent_graph_demo/**'
      - 'tests/graph_demo/**'
      - 'tests/graph/pilot_review.py'
      - 'tests/graph/pilot_expectations.json'
      - 'tests/graph/pilot_boundaries.py'
      - '.github/workflows/agent-graph-demo.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: graph-demo-${{ github.ref }}
  cancel-in-progress: false
jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Docker build settings
        # The demo runs the agent_graph core of the same commit, inside the image too,
        # and checks its core_identity; there is no separate core checkout or mount.
        run: echo "BUILDX_CONFIG=$RUNNER_TEMP/demo-buildx" >> "$GITHUB_ENV"
      - name: Install dedicated runtime and test tools
        run: |
          python -m pip install --require-hashes -r infra/agent_graph_demo/requirements.lock
          python -m pip install httpx==0.28.1 playwright==1.62.0 ruff==0.14.2 'PyYAML>=6.0,<7'
          python -m playwright install --with-deps chromium
      - name: API, queue, recovery and real CLI tests
        run: |
          mkdir -p work
          python tests/graph/ci_unittest.py discover -s tests/graph_demo -t . -v > work/app-tests.log 2>&1             || { grep '^::error' work/app-tests.log; exit 1; }
          python -m ruff check src/agent_graph_demo examples/agent_graph_demo tools/agent_graph_demo tests/graph_demo --select F401,F811,F841
          node --check src/agent_graph_demo/web/app.js
      - name: Core regression on this checkout
        run: |
          PYTHONPATH=src:. python tests/graph/ci_unittest.py discover -s tests/graph -t . -v > work/core-tests.log 2>&1             || { grep '^::error' work/core-tests.log; exit 1; }
      - name: New authored HTTP matrix with separate expectations
        run: |
          python -m tests.graph.pilot_review --runtime --output work/review-matrix
          python -m tests.graph.pilot_boundaries work/review-matrix/deferred-boundaries.json
          python tools/agent_graph_demo/local_show.py --help
      - name: Prepare wheelhouse and build off-VM
        id: image
        run: |
          python -m pip download --only-binary=:all: --require-hashes -r infra/agent_graph_demo/requirements.lock --dest work/wheels
          docker build --network=none -f infra/agent_graph_demo/Dockerfile --build-arg PRODUCT_SHA="$GITHUB_SHA" -t agent-graph-demo:accept .
          echo "image_id=$(docker image inspect agent-graph-demo:accept --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - name: Real Docker and browser A-B-D-E, lifecycle and five shows
        # On failure only exception lines become annotations (logs need sign-in);
        # other output may hold the throwaway acceptance password and stays in the log.
        run: |
          set -o pipefail
          python tools/agent_graph_demo/accept.py --mode local --image '${{ steps.image.outputs.image_id }}' --product-sha "$GITHUB_SHA" --output work/acceptance 2>&1 | tee work/accept.log             || { grep -E '^\{"status": "FAIL"|^[A-Za-z_.]*(Error|Exception)|^  File "' work/accept.log | tail -n 8 | sed 's/^/::error title=demo acceptance::/'; exit 1; }
      - name: Documented clean local-show commands and restart
        run: python tests/graph_demo/local_show_acceptance.py --directory work/local-show-check --image '${{ steps.image.outputs.image_id }}'
      - name: Safe acceptance artifacts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: http-graph-demo-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            work/app-tests.log
            work/core-tests.log
            work/review-matrix/expectations-before.json
            work/review-matrix/observations.json
            work/review-matrix/deferred-boundaries.json
            work/acceptance/ACCEPTANCE.json
            work/acceptance/*.png
            work/local-show-check/LOCAL-SHOW.json
