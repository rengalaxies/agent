name: Cloud.ru bootstrap verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/cloudru/bootstrap/**'
      - 'infra/cloudru/deploy/main.tf'
      - 'ui/nginx.conf'
      - '.github/workflows/cloudru-bootstrap-test.yml'
permissions:
  contents: read
  issues: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare YAML and shell validators
        run: |
          python3 -m pip install pyyaml
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
      - name: Validate rendered cloud-init YAML and shell syntax
        id: verify
        continue-on-error: true
        run: |
          set +e
          python3 - <<'PY' > /tmp/bootstrap-test.log 2>&1
          import pathlib,subprocess,yaml
          root=pathlib.Path("infra/cloudru/bootstrap")
          for name in ("ui","core"):
            original=(root/f"{name}-cloud-init.yaml").read_text()
            rendered=(original.replace("${git_ref}","a"*40)
                      .replace("${core_ip}","10.0.0.22")
                      .replace("${ui_ip_dashed}","203-0-113-77")
                      .replace("${ui_basic_auth_hash}","$2a$12$mock-only-hash"))
            doc=yaml.safe_load(rendered)
            assert isinstance(doc,dict) and doc.get("package_update") is True
            files=doc["write_files"]
            paths=[item["path"] for item in files]
            assert len(paths)==len(set(paths))
            assert len(files)>=2
            assert doc.get("runcmd"), "Missing boot commands"
            for item in files:
              if item["path"].endswith("-start"):
                script=pathlib.Path("/tmp")/f"{name}-start.sh"
                script.write_text(item["content"])
                subprocess.run(["sh","-n",str(script)],check=True)
                # Warnings about shellcheck style are non-blocking; syntax failures block.
                subprocess.run(["shellcheck","-s","sh","-S","error",str(script)],check=True)
            if name=="ui":
              assert any(x["path"]=="/etc/caddy/Caddyfile" for x in files)
          print("Bootstrap YAML and extracted shell scripts: PASS")
          PY
          rc=$?
          echo "code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish result to GitHub
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TEST_RC: ${{ steps.verify.outputs.code }}
        run: |
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path("/tmp/bootstrap-test.log")
          raw=p.read_text(errors="replace") if p.exists() else "No log"
          status="PASS" if os.getenv("TEST_RC")=="0" else "FAIL"
          safe=[line[:250] for line in raw.splitlines() if "Error" in line or "AssertionError" in line or "SyntaxError" in line]
          report=["# Cloud-init bootstrap verification", "**Status:** "+status,
                  "**Run:** "+os.getenv("GITHUB_RUN_ID",""),
                  "**Scope:** approved Cloud.ru project only; static test without provisioning",
                  "## Errors"]+["- "+line for line in safe[:8]]
          pathlib.Path("/tmp/bootstrap-result.md").write_text(chr(10).join(report))
          PY
          TITLE="[Cloud.ru CI] Bootstrap validation"
          ISSUE=$(gh issue list --repo "$GH_REPO" --state open --json number,title --jq '.[] | select(.title == "[Cloud.ru CI] Bootstrap validation") | .number' | head -1)
          if [ -z "$ISSUE" ]; then
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file /tmp/bootstrap-result.md
          else
            gh issue edit "$ISSUE" --repo "$GH_REPO" --body-file /tmp/bootstrap-result.md
          fi
      - name: Reject invalid bootstrap
        if: steps.verify.outputs.code != '0'
        run: exit 1
