name: Deploy and verify persistent managed demo
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudru-managed-demo-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7fb471010211d12af1520d9250d447baa93a7cc0
      - name: Build, deploy and verify durable audit across restart
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          SSE: ${{ secrets.CLOUDRU_STATE_SSE_CUSTOMER_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --quiet requests cryptography boto3
          python3 -u - <<'PY'
          import os,json,base64,time,hashlib,subprocess,re
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          import requests,boto3
          from botocore.config import Config
          project="20853297-65b7-42a8-af40-25c8d2df4e11"
          name="dmrp-demo-audit"
          enc=base64.b64decode("v163R/1hZPy/nAH0xNacyClwaT9ADDGsEny8ESu3/Ja8/JqsnwCoW0ro7wrzrBdMeHTUWZVjiBS2ZCHzDnkisGGWC3nn4IKuZMkMvqQT4hTXkDg0uQrjw0pOt4paDqOTlhwEuWYkuPPOeoqKe+MfazOnDrvIG+/Ev6EROPBgiAZiES2rtglus6xNzlewQk1MQn0aP3Ow31v4XPmNkkRfuUC04ffeTDlaUJh+/K1YE4meuIj/")
          key=base64.b64decode(os.environ["SSE"].strip(),validate=True)
          cfg=json.loads(AESGCM(key).decrypt(enc[:12],enc[12:],b"dmrp-managed-auth-v1"))
          for value in cfg.values(): print("::add-mask::"+value)
          check=requests.get("https://api.github.com/repos/rengalaxies/agent/actions/runs/38726498407",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"]},timeout=30)
          check.raise_for_status()
          assert check.json()["conclusion"]=="success", "Required image verification must pass"
          print("TEST_GATE_PASSED")
          auth=requests.post("https://iam.api.cloud.ru/api/v1/auth/token",json={"keyId":os.environ["KEY_ID"],"secret":os.environ["SECRET"]},timeout=30)
          auth.raise_for_status()
          token=auth.json()["access_token"]
          print("::add-mask::"+token)
          headers={"Authorization":"Bearer "+token}
          base="https://containers.api.cloud.ru/v2/containers/"+name
          params={"projectId":project}
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          session=requests.Session()
          session.mount("https://",HTTPAdapter(max_retries=Retry(total=4,backoff_factor=1,status_forcelist=[429,502,503,504],allowed_methods=["GET"])))
          def get_app():
              r=session.get(base,headers=headers,params=params,timeout=20)
              r.raise_for_status()
              d=r.json()
              assert d["projectId"]==project and d["name"]==name
              return d
          app=get_app()
          template=app["template"]
          assert len(template["containers"])==1
          container=template["containers"][0]
          oldimage=container["image"]
          assert "workflow-"+project in oldimage
          assert any(v["type"]=="s3" and v["volumeAttributes"]["bucketName"]=="dmrp-demo-audit-20853297" for v in template["volumes"])
          image=oldimage.split("@")[0].rsplit(":",1)[0]+":audit-7fb471010211"
          registry=image.split("/")[0]
          result=subprocess.run(["docker","build","-t",image,"."],capture_output=True,text=True)
          assert result.returncode==0, "Docker image build failed"
          print("IMAGE_BUILT")
          result=subprocess.run(["docker","login",registry,"-u",os.environ["KEY_ID"],"--password-stdin"],input=os.environ["SECRET"],capture_output=True,text=True)
          assert result.returncode==0, "Artifact Registry login failed"
          result=subprocess.run(["docker","push",image],capture_output=True,text=True)
          assert result.returncode==0, "Artifact Registry push failed"
          print("IMAGE_PUSHED")
          container["image"]=image
          env=container.get("env") or []
          values={"DMRP_UI_USERNAME":cfg["username"],"DMRP_UI_PASSWORD_SHA256":cfg["sha256"],"DMRP_REQUIRE_AUDIT":"1","DMRP_AUDIT_BACKEND":"object_storage_volume","DMRP_AUDIT_DIRECTORY":"/audit-data"}
          env=[e for e in env if e["name"] not in values]
          env.extend({"name":k,"value":v} for k,v in values.items())
          container["env"]=env
          template["scaling"]["maxInstanceCount"]=1
          template["scaling"]["minInstanceCount"]=1
          r=requests.patch(base,headers=headers,params=params,json={"template":template},timeout=45)
          print("DEPLOY_HTTP",r.status_code)
          r.raise_for_status()
          url=app["configuration"]["ingress"]["publicUri"]
          if not url.startswith("http"): url="https://"+url
          ui_auth=(cfg["username"],cfg["password"])
          def ready():
              for attempt in range(30):
                  try:
                      r=requests.get(url+"/healthz",timeout=12)
                      if r.status_code==200 and r.json().get("audit_backend")=="object_storage_volume":
                          print("PERSISTENT_AUDIT_READY")
                          return
                  except requests.RequestException: pass
                  time.sleep(8)
              raise AssertionError("Persistent volume application did not become ready")
          ready()
          assert requests.get(url,timeout=15).status_code==401
          assert requests.get(url,auth=ui_auth,timeout=15).status_code==200
          catalog=requests.get(url+"/api/v1/demo/scenarios",auth=ui_auth,timeout=15)
          catalog.raise_for_status()
          scenarios=catalog.json()["scenarios"]
          assert scenarios
          saved_result=None
          for s in scenarios[:3]:
              r=requests.post(url+"/api/v1/demo/runs",auth=ui_auth,json={"scenario_id":s["id"]},timeout=30)
              r.raise_for_status()
              result=r.json()
              assert result["audit"]["persisted"] and result["audit"]["backend"]=="object_storage_volume"
              stored=requests.get(url+"/api/v1/demo/audit/"+result["run_id"],auth=ui_auth,timeout=15)
              stored.raise_for_status()
              assert stored.json()["decision"]==result["decision"]
              saved_result=result
          print("PASS_AUTHENTICATED_V2_SCENARIOS",min(3,len(scenarios)))
          k=requests.get(url+"/api/v1/knowledge/map",auth=ui_auth,timeout=15)
          k.raise_for_status()
          assert k.json()
          print("PASS_KNOWLEDGE_MAP")
          access="fc91c42d-c2ea-4d6d-a236-103fd1f37f00:"+os.environ["KEY_ID"]
          print("::add-mask::"+access)
          s3=boto3.client("s3",endpoint_url="https://s3.cloud.ru",region_name="ru-central-1",aws_access_key_id=access,aws_secret_access_key=os.environ["SECRET"],config=Config(s3={"addressing_style":"path"}))
          object_key=saved_result["run_id"]+".json"
          record=json.loads(s3.get_object(Bucket="dmrp-demo-audit-20853297",Key=object_key)["Body"].read())
          assert record["decision"]==saved_result["decision"]
          assert record["payload_sha256"]==saved_result["audit"]["sha256"]
          assert s3.get_bucket_versioning(Bucket="dmrp-demo-audit-20853297").get("Status")=="Enabled"
          print("PASS_INDEPENDENT_VERSIONED_S3_READ")
          print("PUBLIC_DEMO_URL",url)
          print("DEPLOYMENT_ACCEPTANCE_COMPLETE")
          PY
