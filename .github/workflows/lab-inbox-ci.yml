name: Lab initiator and dependent teams inbox replay
on:
  push:
    branches: [feat/postgres-rabbitmq-agent-lab]
    paths: [.github/workflows/lab-inbox-ci.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inbox-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet pika==1.3.2 'psycopg[binary]==3.2.9'
      - name: Independent inbox and authorization tests
        run: python3 -m unittest discover -s lab/tests -v > inbox-unit-tests.log 2>&1
      - name: Actual CLI user journey; explicitly saved real-agent replay
        run: python3 -m lab.evaluator.inbox_flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            inbox-evidence/
            inbox-unit-tests.log
          retention-days: 30
          if-no-files-found: error
