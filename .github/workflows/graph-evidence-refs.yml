name: Graph evidence references (offline only)

on:
  pull_request:
    paths:
      - 'src/agent_graph/**'
      - 'tests/graph/**'
      - 'tools/prepare_evidence_refs_experiment.py'
      - 'tools/*evidence_refs*.py'
      - 'experiments/evidence_refs_v2/**'
      - 'docs/evidence-references-v2.md'
      - '.github/workflows/graph-evidence-refs.yml'
      - '.github/workflows/cloudru-evidence-refs-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install 'pydantic>=2.10,<3' ruff==0.17.1
      - name: Check imports and offline graph regressions (HTTP stubs only)
        run: |
          python -m ruff check src/agent_graph tools/prepare_evidence_refs_experiment.py tests/graph/test_evidence_refs.py tests/graph/test_reference_experiment.py tools/evidence_refs_ledger.py tools/run_evidence_refs_experiment.py tests/graph/test_evidence_refs_review.py tests/graph/test_evidence_refs_runner.py --select F401,F811,F841
          python -m unittest discover -s tests/graph -v
      - name: Prepare fixed next-experiment manifest, never execute it
        run: python tools/prepare_evidence_refs_experiment.py --output work/evidence-refs-v2-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-refs-v2-offline-manifest
          path: work/evidence-refs-v2-manifest.json
          if-no-files-found: error
