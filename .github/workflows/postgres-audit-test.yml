name: PostgreSQL audit integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/audit_pg.py'
      - 'services/demo_api.py'
      - 'services/Dockerfile.demo'
      - 'pyproject.toml'
      - 'infra/cloudru/bootstrap/core-cloud-init.yaml'
      - '.github/workflows/postgres-audit-test.yml'
permissions:
  contents: read
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real PostgreSQL integration, audit verification and persistence
        id: integration
        continue-on-error: true
        run: |
          set -euo pipefail
          trap 'rc=$?; echo "status=$rc" >> "$GITHUB_OUTPUT"; docker rm -f dmrp-test-api dmrp-test-db >/dev/null 2>&1 || true' EXIT
          docker build -f services/Dockerfile.demo -t dmrp-postgres-api:ci .
          docker network create dmrp-pg-ci-net
          docker volume create dmrp-pg-ci-data
          PG_PASSWORD="$(openssl rand -hex 24)"
          docker run -d --rm --name dmrp-test-db --network dmrp-pg-ci-net --network-alias postgres \
            -e POSTGRES_USER=dmrp -e POSTGRES_DB=dmrp \
            -e POSTGRES_PASSWORD="$PG_PASSWORD" \
            -v dmrp-pg-ci-data:/var/lib/postgresql/data postgres:16-alpine
          for i in $(seq 1 45); do
            if docker exec dmrp-test-db pg_isready -U dmrp -d dmrp >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec dmrp-test-db pg_isready -U dmrp -d dmrp
          docker run -d --rm --name dmrp-test-api --network dmrp-pg-ci-net \
            -e DMRP_REQUIRE_AUDIT=1 \
            -e DATABASE_URL="postgresql://dmrp:$PG_PASSWORD@postgres:5432/dmrp" \
            -p 127.0.0.1:18000:8000 dmrp-postgres-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18000/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18000/api/v1/demo/scenarios > /tmp/pg-scenarios.json
          python3 - <<'PY'
          import json
          s=json.load(open("/tmp/pg-scenarios.json"))["scenarios"]
          assert s and s[0]["id"]
          open("/tmp/pg-req.json","w").write(json.dumps({"scenario_id":s[0]["id"]}))
          PY
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data-binary @/tmp/pg-req.json http://127.0.0.1:18000/api/v1/demo/runs > /tmp/pg-decision.json
          python3 - <<'PY'
          import json
          item=json.load(open("/tmp/pg-decision.json"))
          assert item["mode"]=="V2" and item["dataset"]=="development"
          assert item["audit"]["persisted"] and len(item["audit"]["sha256"])==64
          with open("/tmp/pg-run-id","w") as f:f.write(item["run_id"])
          with open("/tmp/pg-hash","w") as f:f.write(item["audit"]["sha256"])
          print("Real V2 decision with persisted PostgreSQL audit: PASS")
          PY
          RUN_ID=$(cat /tmp/pg-run-id)
          PG_HASH=$(docker exec dmrp-test-db psql -U dmrp -d dmrp -Atc \
            "SELECT payload_sha256 FROM demo_release_audit WHERE run_id='$RUN_ID'")
          test "$PG_HASH" = "$(cat /tmp/pg-hash)"
          docker stop dmrp-test-db >/dev/null
          docker run -d --rm --name dmrp-test-db --network dmrp-pg-ci-net --network-alias postgres \
            -e POSTGRES_USER=dmrp -e POSTGRES_DB=dmrp \
            -e POSTGRES_PASSWORD="$PG_PASSWORD" \
            -v dmrp-pg-ci-data:/var/lib/postgresql/data postgres:16-alpine
          for i in $(seq 1 45); do
            if docker exec dmrp-test-db pg_isready -U dmrp -d dmrp >/dev/null 2>&1; then break; fi
            sleep 2
          done
          PG_RESTART_HASH=$(docker exec dmrp-test-db psql -U dmrp -d dmrp -Atc \
            "SELECT payload_sha256 FROM demo_release_audit WHERE run_id='$RUN_ID'")
          test "$PG_RESTART_HASH" = "$(cat /tmp/pg-hash)"
          echo "Persisted audit survives PostgreSQL container restart: PASS"
      - name: Publish audit test status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TEST_RC: ${{ steps.integration.outputs.status }}
        run: |
          python3 - <<'PY'
          import pathlib,os
          ok=os.getenv("TEST_RC")=="0"
          lines=["# Real PostgreSQL audit verification",
                 "**Result:** "+("PASS" if ok else "FAIL"),
                 "**Run:** "+os.getenv("GITHUB_RUN_ID",""),
                 "**Scope:** local Docker PostgreSQL only, no Cloud.ru resources created",
                 "**Tests:** V2 real release, mandatory PostgreSQL audit SHA256, restart persistence",
                 "**Cloud.ru PostgreSQL runtime:** unverified until paid VM launch"]
          pathlib.Path("/tmp/pg-audit-result.md").write_text(chr(10).join(lines))
          PY
          TITLE="[Cloud.ru CI] PostgreSQL audit integration"
          ISSUE=$(gh issue list --repo "$GH_REPO" --state open --json number,title --jq '.[] | select(.title == "[Cloud.ru CI] PostgreSQL audit integration") | .number' | head -1)
          if [ -z "$ISSUE" ]; then
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file /tmp/pg-audit-result.md
          else
            gh issue edit "$ISSUE" --repo "$GH_REPO" --body-file /tmp/pg-audit-result.md
          fi
      - name: Enforce PostgreSQL result
        if: steps.integration.outputs.status != '0'
        run: exit 1
