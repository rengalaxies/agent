name: Cloud.ru Terraform state read-only validation
on:
  workflow_dispatch:
    inputs:
      verify_encrypted_backend:
        description: "Test isolated encrypted Terraform state and lock, without VMs"
        type: boolean
        default: false
      configure_project_tag:
        description: "Configure project tag and block public access on test-bucket-ds"
        type: boolean
        default: false
  schedule:
    - cron: '15 7 * * *'
  push:
    branches: [main]
    paths:
      - 'infra/cloudru/deploy/check_state_bucket.py'
      - '.github/workflows/cloudru-state-preflight.yml'
permissions:
  contents: read
  issues: write
jobs:
  read-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test project-bound bucket policy checker without cloud access
        run: |
          python3 - <<'PY'
          import os,importlib.util
          spec=importlib.util.spec_from_file_location("check","infra/cloudru/deploy/check_state_bucket.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          os.environ["CLOUDRU_STATE_BUCKET"]="dmrp-tfstate-daniil-test"
          class Fake:
            def head_bucket(self,**k):return {}
            def get_bucket_versioning(self,**k):return {"Status":"Enabled"}
            def get_bucket_tagging(self,**k):return {"TagSet":[{"Key":"cloudru_project_id","Value":mod.EXPECTED}]}
            def get_public_access_block(self,**k):return {"PublicAccessBlockConfiguration":{k:True for k in ("BlockPublicAcls","IgnorePublicAcls","BlockPublicPolicy","RestrictPublicBuckets")}}
          assert mod.validate(Fake())["tag_scope_verified"]
          class WrongProject(Fake):
            def get_bucket_tagging(self,**k):return {"TagSet":[{"Key":"cloudru_project_id","Value":"other-project"}]}
          try:mod.validate(WrongProject())
          except AssertionError:pass
          else:raise RuntimeError("project isolation test failed")
          print("State bucket read-only logic and cross-project rejection PASS")
          PY
      - name: Configure approved bucket tag and privacy
        if: inputs.configure_project_tag
        env:
          CLOUDRU_TENANT_ID: ${{ vars.CLOUDRU_TENANT_ID }}
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          CLOUDRU_STATE_BUCKET: ${{ vars.CLOUDRU_STATE_BUCKET }}
        run: |
          python3 -m pip install --quiet 'boto3>=1.34,<2'
          python3 - <<'PY'
          import os,boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError
          tenant=os.environ["CLOUDRU_TENANT_ID"]
          bucket=os.environ["CLOUDRU_STATE_BUCKET"]
          assert tenant=="fc91c42d-c2ea-4d6d-a236-103fd1f37f00"
          assert bucket=="test-bucket-ds"
          access=tenant+":"+os.environ["CLOUDRU_KEY_ID"]
          print("::add-mask::"+access)
          s3=boto3.client("s3",endpoint_url="https://s3.cloud.ru",region_name="ru-central-1",
              aws_access_key_id=access,aws_secret_access_key=os.environ["CLOUDRU_SECRET"],
              config=Config(s3={"addressing_style":"path"}))
          try: tags=s3.get_bucket_tagging(Bucket=bucket).get("TagSet",[])
          except ClientError as error:
              if error.response["Error"]["Code"]!="NoSuchTagSet": raise RuntimeError("Unable to read existing bucket tags") from None
              tags=[]
          expected="20853297-65b7-42a8-af40-25c8d2df4e11"
          current={t["Key"]:t["Value"] for t in tags}
          assert current.get("cloudru_project_id",expected)==expected, "Conflicting project tag"
          current["cloudru_project_id"]=expected
          s3.put_bucket_tagging(Bucket=bucket,Tagging={"TagSet":[{"Key":k,"Value":v} for k,v in current.items()]})
          verified={t["Key"]:t["Value"] for t in s3.get_bucket_tagging(Bucket=bucket)["TagSet"]}
          assert verified==current
          print("Approved project tag configured and verified; existing tags preserved")
          required=("BlockPublicAcls","IgnorePublicAcls","BlockPublicPolicy","RestrictPublicBuckets")
          s3.put_public_access_block(Bucket=bucket,PublicAccessBlockConfiguration={k:True for k in required})
          public=s3.get_public_access_block(Bucket=bucket)["PublicAccessBlockConfiguration"]
          assert all(public.get(k) is True for k in required)
          print("All four public access restrictions configured and verified")
          PY
      - name: Probe state bucket read-only if credentials exist
        id: probe
        continue-on-error: true
        env:
          CLOUDRU_TENANT_ID: ${{ vars.CLOUDRU_TENANT_ID }}
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          CLOUDRU_STATE_ACCESS_KEY_ID: ${{ secrets.CLOUDRU_STATE_ACCESS_KEY_ID }}
          CLOUDRU_STATE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDRU_STATE_SECRET_ACCESS_KEY }}
          CLOUDRU_STATE_BUCKET: ${{ vars.CLOUDRU_STATE_BUCKET }}
          CLOUDRU_STATE_S3_ENDPOINT: ${{ vars.CLOUDRU_STATE_S3_ENDPOINT }}
          CLOUDRU_STATE_REGION: ${{ vars.CLOUDRU_STATE_REGION }}
          CLOUDRU_STATE_REPORT: /tmp/dmrp-state-result.json
        run: |
          if [ -z "$CLOUDRU_STATE_BUCKET" ] || { [ -z "$CLOUDRU_STATE_ACCESS_KEY_ID" ] && { [ -z "$CLOUDRU_TENANT_ID" ] || [ -z "$CLOUDRU_KEY_ID" ] || [ -z "$CLOUDRU_SECRET" ]; }; }; then
            echo '{"status":"CONFIGURATION_REQUIRED","lockfile_compatibility":"NOT_TESTED"}' > "$CLOUDRU_STATE_REPORT"
            echo "probe_rc=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -m pip install --quiet 'boto3>=1.34,<2'
          if python3 infra/cloudru/deploy/check_state_bucket.py; then
            echo "probe_rc=0" >> "$GITHUB_OUTPUT"
          else
            echo "probe_rc=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: hashicorp/setup-terraform@v3
        if: inputs.verify_encrypted_backend
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Verify real encrypted S3 backend and concurrent lock
        if: inputs.verify_encrypted_backend
        env:
          CLOUDRU_TENANT_ID: ${{ vars.CLOUDRU_TENANT_ID }}
          CLOUDRU_KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          CLOUDRU_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          CLOUDRU_STATE_BUCKET: ${{ vars.CLOUDRU_STATE_BUCKET }}
        run: |
          python3 -m pip install --quiet 'boto3>=1.34,<2'
          python3 - <<'PY'
          import os,base64,secrets,tempfile,pathlib,subprocess,time,json,boto3
          from botocore.config import Config
          tenant=os.environ["CLOUDRU_TENANT_ID"]
          bucket=os.environ["CLOUDRU_STATE_BUCKET"]
          assert tenant=="fc91c42d-c2ea-4d6d-a236-103fd1f37f00" and bucket=="test-bucket-ds"
          access=tenant+":"+os.environ["CLOUDRU_KEY_ID"]
          print("::add-mask::"+access)
          key=secrets.token_bytes(32)
          encoded=base64.b64encode(key).decode()
          print("::add-mask::"+encoded)
          env=dict(os.environ,AWS_ACCESS_KEY_ID=access,AWS_SECRET_ACCESS_KEY=os.environ["CLOUDRU_SECRET"],AWS_SSE_CUSTOMER_KEY=encoded,TF_IN_AUTOMATION="true")
          prefix="terraform/p1/backend-probe-"+os.environ["GITHUB_RUN_ID"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"]
          s3=boto3.client("s3",endpoint_url="https://s3.cloud.ru",region_name="ru-central-1",aws_access_key_id=access,aws_secret_access_key=os.environ["CLOUDRU_SECRET"],config=Config(s3={"addressing_style":"path"}))
          cfg='''terraform {
            backend "s3" {}
          }
          resource "terraform_data" "probe" {
            input = "non-sensitive backend compatibility test"
            provisioner "local-exec" {
              command = "sleep 20"
            }
          }
          '''
          flags=["-backend-config="+v for v in [
          "bucket="+bucket,"key="+prefix+".tfstate","region=ru-central-1",
          'endpoints={s3="https://s3.cloud.ru"}',"use_lockfile=true","encrypt=true",
          "skip_credentials_validation=true","skip_region_validation=true",
          "skip_requesting_account_id=true","skip_metadata_api_check=true","use_path_style=true"]]
          def run(directory,args,environment=env,success=True):
              p=subprocess.run(["terraform"]+args,cwd=directory,env=environment,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
              if success and p.returncode: raise RuntimeError("Terraform backend operation failed: "+args[0])
              return p
          with tempfile.TemporaryDirectory() as root:
              writer=pathlib.Path(root)/"writer"; reader=pathlib.Path(root)/"reader"
              for d in (writer,reader):
                  d.mkdir(); (d/"main.tf").write_text(cfg)
              run(writer,["init","-input=false","-no-color"]+flags)
              log=open(pathlib.Path(root)/"writer.log","w")
              process=subprocess.Popen(["terraform","apply","-auto-approve","-input=false","-no-color"],cwd=writer,env=env,stdout=log,stderr=subprocess.STDOUT)
              try:
                  locked=False
                  for attempt in range(15):
                      try:
                          h=s3.head_object(Bucket=bucket,Key=prefix+".tfstate.tflock",SSECustomerAlgorithm="AES256",SSECustomerKey=key)
                          assert h.get("SSECustomerAlgorithm")=="AES256"
                          locked=True; break
                      except Exception: time.sleep(1)
                  assert locked,"Encrypted lock object not observed"
                  competitor=run(writer,["plan","-input=false","-no-color","-lock-timeout=1s"],success=False)
                  assert competitor.returncode and "Error acquiring the state lock" in competitor.stdout,"Concurrent state operation did not reject occupied lock"
                  assert process.wait(timeout=60)==0,"Probe apply failed"
              finally:
                  if process.poll() is None: process.kill(); process.wait()
                  log.close()
              h=s3.head_object(Bucket=bucket,Key=prefix+".tfstate",SSECustomerAlgorithm="AES256",SSECustomerKey=key)
              assert h.get("SSECustomerAlgorithm")=="AES256","State SSE-C not confirmed"
              try: s3.get_object(Bucket=bucket,Key=prefix+".tfstate")
              except Exception: pass
              else: raise AssertionError("Encrypted state readable without encryption key")
              run(reader,["init","-input=false","-no-color"]+flags)
              state=json.loads(run(reader,["state","pull"]).stdout)
              assert [r["type"] for r in state["resources"]]==["terraform_data"]
              assert run(reader,["plan","-input=false","-no-color","-detailed-exitcode"],success=False).returncode==0
              print("REAL S3 BACKEND PASS: SSE-C state and lock, concurrent lock rejection, fresh-directory recovery, no-op plan")
              # Remove only exact disposable probe objects and their versions, never production state.
              for object_key in (prefix+".tfstate",prefix+".tfstate.tflock"):
                  response=s3.list_object_versions(Bucket=bucket,Prefix=object_key)
                  for item in response.get("Versions",[])+response.get("DeleteMarkers",[]):
                      if item["Key"]==object_key:
                          s3.delete_object(Bucket=bucket,Key=object_key,VersionId=item["VersionId"])
              print("Disposable probe versions removed; production state untouched")
          
          PY
      - name: Publish sanitized state readiness
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path("/tmp/dmrp-state-result.json")
          data=json.loads(p.read_text()) if p.exists() else {"status":"ERROR"}
          status=data.get("status") or ("READ_ONLY_PASS" if data.get("tag_scope_verified") else "ERROR")
          lines=["# Cloud.ru Terraform state readiness","**Status:** "+status,
                 "**Project:** 20853297-65b7-42a8-af40-25c8d2df4e11",
                 "**Run:** ${{ github.run_id }}",
                 "**Mode:** scoped tag/privacy configuration if explicitly selected, then read-only checks; no bucket or objects created",
                 "**Bucket read access:** "+str(data.get("bucket_read_access",data.get("tag_scope_verified",False))),
                 "**Diagnostic:** "+data.get("diagnostic","none"),
                 "**Lockfile:** NOT_TESTED (requires dedicated safe access verification)",
                 "**Bucket ownership:** requires owner review; matching tag is an additional safeguard"]
          pathlib.Path("/tmp/state-issue.md").write_text(chr(10).join(lines))
          PY
          TITLE="[Cloud.ru CI] Remote Terraform state"
          ISSUE=$(gh issue list --repo "$GH_REPO" --state open --json number,title --jq '.[] | select(.title == "[Cloud.ru CI] Remote Terraform state") | .number' | head -1)
          if [ -z "$ISSUE" ]; then
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file /tmp/state-issue.md
          else
            gh issue edit "$ISSUE" --repo "$GH_REPO" --body-file /tmp/state-issue.md
          fi
      - name: Enforce credential-backed check when attempted
        if: steps.probe.outputs.probe_rc != '0'
        run: exit 1
