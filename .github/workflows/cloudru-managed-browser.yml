name: Verify managed demo in browser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cloudru-managed-browser.yml"]
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Exercise the actual public page and V2 button
        env:
          GH_TOKEN: ${{ github.token }}
          SSE: ${{ secrets.CLOUDRU_STATE_SSE_CUSTOMER_KEY }}
        run: |
          python3 -m pip install --quiet playwright cryptography requests
          python3 -u - <<'PY'
          import os,json,base64,time,hashlib,shutil,subprocess
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          import requests
          enc=base64.b64decode("v163R/1hZPy/nAH0xNacyClwaT9ADDGsEny8ESu3/Ja8/JqsnwCoW0ro7wrzrBdMeHTUWZVjiBS2ZCHzDnkisGGWC3nn4IKuZMkMvqQT4hTXkDg0uQrjw0pOt4paDqOTlhwEuWYkuPPOeoqKe+MfazOnDrvIG+/Ev6EROPBgiAZiES2rtglus6xNzlewQk1MQn0aP3Ow31v4XPmNkkRfuUC04ffeTDlaUJh+/K1YE4meuIj/")
          key=base64.b64decode(os.environ["SSE"].strip(),validate=True)
          cfg=json.loads(AESGCM(key).decrypt(enc[:12],enc[12:],b"dmrp-managed-auth-v1"))
          for value in cfg.values(): print("::add-mask::"+value)
          for attempt in range(45):
              deploy=requests.get("https://api.github.com/repos/rengalaxies/agent/actions/runs/38726642963",headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"]},timeout=20)
              deploy.raise_for_status()
              if deploy.json()["status"]=="completed":
                  assert deploy.json()["conclusion"]=="success", "Cloud durability verification must pass"
                  break
              time.sleep(8)
          else: raise AssertionError("Cloud deployment still running")
          url="https://appd6bx6ql6wqmzsno1jnp258579.containerapps.ru"
          for attempt in range(36):
              try:
                  r=requests.get(url+"/healthz",timeout=10)
                  if r.ok and r.json().get("audit_backend")=="object_storage_volume": break
              except requests.RequestException: pass
              time.sleep(8)
          else: raise AssertionError("Persistent audit readiness not reached")
          from playwright.sync_api import sync_playwright
          executable=shutil.which("google-chrome") or shutil.which("google-chrome-stable")
          if not executable:
              subprocess.run(["python3","-m","playwright","install","chromium"],check=True,capture_output=True)
          with sync_playwright() as p:
              options={"headless":True,"args":["--no-sandbox"]}
              if executable: options["executable_path"]=executable
              browser=p.chromium.launch(**options)
              context=browser.new_context(http_credentials={"username":cfg["username"],"password":cfg["password"]})
              page=context.new_page()
              page.on("pageerror",lambda error: print("BROWSER_SCRIPT_ERROR",str(error)[:300]))
              page.goto(url,wait_until="networkidle",timeout=60000)
              print("BROWSER_LIVE_STATUS",page.locator("#live-status").inner_text())
              page.wait_for_function("!document.getElementById('live-run').disabled",timeout=30000)
              assert page.locator("#live-scenario option").count()>0
              page.locator("#live-run").click()
              page.wait_for_function("document.getElementById('live-status').textContent.startsWith('Завершено')",timeout=30000)
              result=json.loads(page.locator("#live-result").inner_text())
              assert result["audit"]["persisted"] and result["audit"]["backend"]=="object_storage_volume"
              persisted=page.evaluate("async id => {const r=await fetch('/api/v1/demo/audit/'+id);return {status:r.status,body:await r.json()}}",result["run_id"])
              assert persisted["status"]==200
              assert persisted["body"]["decision"]==result["decision"]
              assert persisted["body"]["payload_sha256"]==result["audit"]["sha256"]
              assert page.locator("#kg-nodes").inner_text().strip()
              print("PASS_BROWSER_UI_V2_BUTTON_AND_PERSISTED_RESULT")
              print("PASS_BROWSER_KNOWLEDGE_MAP")
              context.close()
              browser.close()
          PY
