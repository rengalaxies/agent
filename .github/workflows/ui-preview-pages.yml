name: Public static interview preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-preview-pages.yml'
permissions:
  contents: read
  pages: write
  issues: write
  id-token: write
concurrency:
  group: ui-preview-github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify preview contains no privileged data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path("ui/index.html").read_text()
          assert "SYNTHETIC DATA" in html and "evaluation_oracle_loaded" in html
          assert "CLOUDRU_SECRET" not in html
          print("Only standalone synthetic public UI is published.")
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui
      - name: Publish synthetic-only UI preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report actual GitHub Pages result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PAGES_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          python3 - <<'PY'
          import os,pathlib
          url=os.getenv("PAGE_URL","")
          outcome=os.getenv("PAGES_OUTCOME","unavailable")
          lines=["# Synthetic UI GitHub Pages preview",
                 "**Deployment outcome:** "+outcome,
                 "**URL:** "+(url if url.startswith("https://") else "NOT AVAILABLE"),
                 "**Run:** "+os.getenv("GITHUB_RUN_ID",""),
                 "**Scope:** no paid Cloud.ru resources; static synthetic demonstration only",
                 "**Important:** this preview has no live V2 backend; live APIs require private Cloud.ru core"]
          pathlib.Path("/tmp/ui-preview-status.md").write_text(chr(10).join(lines))
          PY
          TITLE="[Cloud.ru CI] Static UI preview"
          ISSUE=$(gh issue list --repo "$GH_REPO" --state open --json number,title --jq '.[] | select(.title == "[Cloud.ru CI] Static UI preview") | .number' | head -1)
          if [ -z "$ISSUE" ]; then
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file /tmp/ui-preview-status.md
          else
            gh issue edit "$ISSUE" --repo "$GH_REPO" --body-file /tmp/ui-preview-status.md
          fi
