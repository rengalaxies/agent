name: Public static interview preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-preview-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ui-preview-github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify preview contains no privileged data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path("ui/index.html").read_text()
          assert "SYNTHETIC DATA" in html and "evaluation_oracle_loaded" in html
          assert "CLOUDRU_SECRET" not in html
          print("Only standalone synthetic public UI is published.")
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui
      - name: Publish synthetic-only UI preview
        id: deployment
        uses: actions/deploy-pages@v4
