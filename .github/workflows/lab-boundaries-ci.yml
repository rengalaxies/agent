name: Lab independent R6 R7 R8 qualification
on:
  push:
    branches: [feat/postgres-rabbitmq-agent-lab]
    paths: [.github/workflows/lab-boundaries-ci.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install --quiet pika==1.3.2 'psycopg[binary]==3.2.9'
      - name: Independent scope, coverage, freshness and authority-race tests
        run: |
          python3 -m unittest discover -s lab/tests -v > boundary-tests.log 2>&1
          python3 - <<'PY'
          import os,json,pathlib
          from lab.evaluator.qualify_boundaries import qualify
          result=qualify('.', 'r6-r8.json')
          result['source_commit']=os.environ['GITHUB_SHA']
          result['actions_run']='https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          pathlib.Path('r6-r8.json').write_text(json.dumps(result,indent=2))
          assert result['outcome']=='PASS'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundaries-${{ github.sha }}
          path: |
            boundary-tests.log
            r6-r8.json
          retention-days: 30
