name: Pilot candidate offline qualification
on:
  pull_request:
    paths:
      - 'src/agent_graph/**'
      - 'src/agent_service/**'
      - 'src/agent_graph_demo/**'
      - 'tests/graph/candidate*'
      - 'tests/graph/test_candidate*'
      - 'tools/pilot_candidate/**'
      - '.github/workflows/pilot-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline fixture dependencies, MODEL OFF
        run: |
          python -m pip install --require-hashes -r infra/agent_graph_demo/requirements.lock
          python -m pip install PyYAML==6.0.3
          mkdir -p work/candidate
      - name: Author cases with an independent HTTP oracle
        run: |
          python -m tests.graph.candidate_matrix --runtime --output work/candidate/matrix
          python -m tests.graph.pilot_boundaries work/candidate/boundaries.json
          python - <<'PY'
          import json
          from pathlib import Path
          from agent_graph import PROFILE
          matrix = json.loads(Path('work/candidate/matrix/observations.json').read_text())
          boundaries = json.loads(Path('work/candidate/boundaries.json').read_text())
          integration = PROFILE != 'http-requests-4'
          if integration:
              assert matrix['status'] == 'PASS'
              assert all(x['status'] == 'PASS' for x in boundaries)
          else:
              print('::notice::BASELINE: known main defects remain; this green workflow does not qualify the combined candidate')
          Path('work/candidate/qualification.json').write_text(json.dumps(dict(
              profile=PROFILE, matrix=matrix['status'], integration=integration,
              release='PENDING_APPROVAL', model='OFF', participant='NOT_RUN', vm='NOT_RUN', external='NOT_RUN')))
          PY
      - name: Actual old/new processes, partial reanalysis, rollback and re-upgrade
        run: |
          PROFILE=$(python -c 'import agent_graph; print(agent_graph.PROFILE)')
          if [ "$PROFILE" = http-requests-4 ]; then
            echo 'NOT_RUN: combined profile requires explicit M3 approval; baseline diagnostics only'
          else
            git worktree add --detach "$RUNNER_TEMP/pilot-old" e84e91395a8846e2f43df3a1a6e402e3487e7a27
            python tools/pilot_candidate/migration.py run --old-checkout "$RUNNER_TEMP/pilot-old" --new-checkout "$GITHUB_WORKSPACE" --output work/candidate/migration
          fi
      - name: Reproducible unpublished candidate, manifest and checksum
        run: |
          PROFILE=$(python -c 'import agent_graph; print(agent_graph.PROFILE)')
          if [ "$PROFILE" != http-requests-4 ]; then
            python -m pip download --only-binary=:all: --require-hashes -r infra/agent_service/requirements.lock --dest work/candidate/wheels
            python tools/agent_service/box/release.py build --commit HEAD --wheelhouse work/candidate/wheels --output work/candidate/A > work/candidate/build.json
            python tools/agent_service/box/release.py build --commit HEAD --wheelhouse work/candidate/wheels --output work/candidate/B > /dev/null
            cmp work/candidate/A/*.tar.gz work/candidate/B/*.tar.gz
            (cd work/candidate/A && sha256sum -c ./*.sha256)
            mkdir -p work/candidate/extracted
            tar -xzf work/candidate/A/*.tar.gz -C work/candidate/extracted
            python tools/agent_service/box/release.py verify work/candidate/extracted/agent-service-* > work/candidate/verify.json
          fi
      - name: Safe evidence only; no binary release, connections or private state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pending-pilot-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          path: |
            work/candidate/qualification.json
            work/candidate/boundaries.json
            work/candidate/matrix/expectations-before.json
            work/candidate/matrix/observations.json
            work/candidate/migration/MIGRATION.json
            work/candidate/build.json
            work/candidate/verify.json
            work/candidate/A/*.manifest.json
            work/candidate/A/*.sha256
