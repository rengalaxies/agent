name: Cloud.ru UI scoped recovery
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Plan or recover only the approved UI VM; preserve disks and private core"
        required: true
        type: choice
        default: plan
        options: [plan, recover]
      project_id_confirmation:
        description: "Type the exact approved Cloud.ru project UUID"
        required: true
        type: string
      approve_monthly_rub:
        description: "Approved monthly RUB ceiling (must be at least 8000)"
        required: true
        type: string
      ssh_admin_cidr:
        description: "Temporary owner SSH IPv4 /32; empty keeps public SSH disabled"
        required: false
        default: ""
        type: string
      approval_phrase:
        description: "Type AUTHORIZE-PAID-DEPLOYMENT to acknowledge billing"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cloudru-daniil-p1-deployment
  cancel-in-progress: false
jobs:
  apply:
    environment:
      name: cloudru-p1-production
    runs-on: ubuntu-latest
    env:
      RECOVERY_STAGE: ${{ inputs.stage }}
      TF_VAR_project_id: "20853297-65b7-42a8-af40-25c8d2df4e11"
      TF_VAR_git_ref: "29223626ae81cc51a97698bb77475b3640a660fa"
      TF_VAR_auth_key_id: ${{ secrets.CLOUDRU_KEY_ID }}
      TF_VAR_auth_secret: ${{ secrets.CLOUDRU_SECRET }}
      TF_VAR_ui_flavor: "gen-2-4"
      TF_VAR_core_flavor: "gen-2-8"
      TF_VAR_ubuntu_image_id: "fe51a6e6-a5ad-410e-b441-1a195208a8cf"
      TF_VAR_admin_cidr: ${{ inputs.ssh_admin_cidr || vars.CLOUDRU_ADMIN_CIDR }}
      TF_VAR_ssh_public_key: ${{ secrets.CLOUDRU_SSH_PUBLIC_KEY }}
      TF_VAR_ui_basic_auth_hash: ${{ secrets.CLOUDRU_UI_BASIC_AUTH_HASH }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Validate and mask temporary SSH owner address
        env:
          ADMIN_CIDR: ${{ inputs.ssh_admin_cidr || vars.CLOUDRU_ADMIN_CIDR }}
        run: |
          python3 - <<'PY'
          import os,ipaddress
          value=os.environ.get("ADMIN_CIDR","")
          if value:
              network=ipaddress.ip_network(value,strict=True)
              assert network.version==4 and network.prefixlen==32
              assert network.network_address.is_global
              print("::add-mask::"+value)
              print("::add-mask::"+str(network.network_address))
          PY
      - name: Select scoped S3 credentials without exposing values
        env:
          RAW_STATE_SSE: ${{ secrets.CLOUDRU_STATE_SSE_CUSTOMER_KEY }}
          TENANT: ${{ vars.CLOUDRU_TENANT_ID }}
          BUCKET: ${{ vars.CLOUDRU_STATE_BUCKET }}
          STATE_ACCESS: ${{ secrets.CLOUDRU_STATE_ACCESS_KEY_ID }}
          STATE_SECRET: ${{ secrets.CLOUDRU_STATE_SECRET_ACCESS_KEY }}
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
        run: |
          python3 - <<'PY'
          import os,base64
          access=os.getenv("STATE_ACCESS")
          secret=os.getenv("STATE_SECRET")
          if not access and not secret:
              assert os.environ["TENANT"]=="fc91c42d-c2ea-4d6d-a236-103fd1f37f00"
              assert os.environ["BUCKET"]=="test-bucket-ds"
              access=os.environ["TENANT"]+":"+os.environ["KEY_ID"]
              secret=os.environ["SECRET"]
          assert access and secret, "Incomplete S3 credentials"
          assert "\n" not in access and "\n" not in secret
          print("::add-mask::"+access)
          print("::add-mask::"+secret)
          sse=os.environ["RAW_STATE_SSE"].strip()
          assert len(base64.b64decode(sse,validate=True))==32, "Invalid state encryption key"
          print("::add-mask::"+sse)
          with open(os.environ["GITHUB_ENV"],"a") as file:
              file.write("SCOPED_SSE_KEY="+sse+"\n")
              file.write("SCOPED_S3_ACCESS="+access+"\nSCOPED_S3_SECRET="+secret+"\n")
          PY
      - name: Strict scope and owner approval gate
        env:
          APPROVED_PROJECT: ${{ inputs.project_id_confirmation }}
          APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
          CEILING: ${{ inputs.approve_monthly_rub }}
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          STATE_ACCESS: ${{ env.SCOPED_S3_ACCESS }}
          STATE_SECRET: ${{ env.SCOPED_S3_SECRET }}
          STATE_SSE: ${{ env.SCOPED_SSE_KEY }}
          STATE_BUCKET: ${{ vars.CLOUDRU_STATE_BUCKET }}
          STATE_ENDPOINT: ${{ vars.CLOUDRU_STATE_S3_ENDPOINT }}
          SSH_PUB: ${{ secrets.CLOUDRU_SSH_PUBLIC_KEY }}
          ADMIN_CIDR: ${{ inputs.ssh_admin_cidr || vars.CLOUDRU_ADMIN_CIDR }}
          UI_HASH: ${{ secrets.CLOUDRU_UI_BASIC_AUTH_HASH }}
        run: |
          set -eu
          test "$APPROVED_PROJECT" = "20853297-65b7-42a8-af40-25c8d2df4e11" || exit 1
          test "$APPROVAL_PHRASE" = "AUTHORIZE-PAID-DEPLOYMENT" || exit 1
          case "$CEILING" in *[!0-9]*|"") echo "Invalid budget ceiling"; exit 1;; esac
          test "$CEILING" -ge 8000 || { echo "Budget ceiling below reference estimate"; exit 1; }
          for VALUE in "$KEY_ID" "$SECRET" "$STATE_ACCESS" "$STATE_SECRET" "$STATE_SSE" "$STATE_BUCKET" "$SSH_PUB" "$UI_HASH"; do
            test -n "$VALUE" || { echo "Missing mandatory protected value"; exit 1; }
          done
          case "$SSH_PUB" in ssh-ed25519\ *|ssh-rsa\ *) : ;; *) echo "Invalid SSH public key"; exit 1;; esac
          case "$ADMIN_CIDR" in 0.0.0.0/0|192.0.2.*|198.51.100.*|203.0.113.*) echo "Placeholder or open SSH CIDR"; exit 1;; esac
          # shellcheck disable=SC2016
          case "$UI_HASH" in \$2a\$*|\$2b\$*|\$2y\$*) : ;; *) echo "Invalid bcrypt UI hash"; exit 1;; esac
          test ! -e infra/cloudru/deploy/backend.tf || { echo "Backend file must be initialized by this workflow only"; exit 1; }
      - name: Verify remote state bucket ownership and privacy before any apply
        env:
          CLOUDRU_STATE_ACCESS_KEY_ID: ${{ env.SCOPED_S3_ACCESS }}
          CLOUDRU_STATE_SECRET_ACCESS_KEY: ${{ env.SCOPED_S3_SECRET }}
          CLOUDRU_STATE_BUCKET: ${{ vars.CLOUDRU_STATE_BUCKET }}
          CLOUDRU_STATE_S3_ENDPOINT: ${{ vars.CLOUDRU_STATE_S3_ENDPOINT }}
          CLOUDRU_STATE_REGION: ${{ vars.CLOUDRU_STATE_REGION }}
          CLOUDRU_STATE_REPORT: /tmp/cloudru-s3-ownership.json
        run: |
          set -eu
          python3 -m pip install --quiet 'boto3>=1.34,<2'
          python3 infra/cloudru/deploy/check_state_bucket.py
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/cloudru-s3-ownership.json"))
          assert r.get("project_id")=="20853297-65b7-42a8-af40-25c8d2df4e11"
          assert r.get("tag_scope_verified") and r.get("private")
          assert r.get("versioning")=="Enabled"
          print("S3 state bucket private, versioned and tagged for approved Cloud.ru project")
          PY
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cloudru-provider-cache
          key: cloudru-provider-2.1.3-${{ runner.os }}-${{ runner.arch }}
      - name: Configure Cloud.ru provider mirror
        run: |
          mkdir -p "$RUNNER_TEMP/cloudru-provider-cache"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/cloudru-provider-cache" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/terraform.tfrc" <<'EOF'
          provider_installation {
            network_mirror {
              url = "https://evo-tf-provider-generic.ar.cloud.ru/"
              include = ["cloudru/*"]
            }
            direct { exclude = ["cloudru/*"] }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/terraform.tfrc" >> "$GITHUB_ENV"
      - name: Initialize encrypted remote Terraform state with lockfile
        working-directory: infra/cloudru/deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ env.SCOPED_S3_ACCESS }}
          AWS_SECRET_ACCESS_KEY: ${{ env.SCOPED_S3_SECRET }}
          AWS_SSE_CUSTOMER_KEY: ${{ env.SCOPED_SSE_KEY }}
          STATE_BUCKET: ${{ vars.CLOUDRU_STATE_BUCKET }}
          STATE_ENDPOINT: ${{ vars.CLOUDRU_STATE_S3_ENDPOINT }}
          STATE_REGION: ${{ vars.CLOUDRU_STATE_REGION }}
        run: |
          set -eu
          cat > backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
          STATE_ENDPOINT="${STATE_ENDPOINT:-https://s3.cloud.ru}"
          terraform init -reconfigure -input=false -no-color \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=terraform/p1/daniil-smirnov.tfstate" \
            -backend-config="region=${STATE_REGION:-ru-central-1}" \
            -backend-config="endpoints={s3=\"$STATE_ENDPOINT\"}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="use_path_style=true"
          if ! terraform state list > "$RUNNER_TEMP/state-inventory.txt" 2> "$RUNNER_TEMP/state-read-error.txt"; then
            if ! grep -q -F "No state file was found" "$RUNNER_TEMP/state-read-error.txt"; then
              cat "$RUNNER_TEMP/state-read-error.txt"
              exit 1
            fi
            echo "First deployment: production remote state has not been created yet"
          fi
      - name: Prepare isolated installation credential and single runner address
        id: prepare
        env:
          AWS_ACCESS_KEY_ID: ${{ env.SCOPED_S3_ACCESS }}
          AWS_SECRET_ACCESS_KEY: ${{ env.SCOPED_S3_SECRET }}
          AWS_SSE_CUSTOMER_KEY: ${{ env.SCOPED_SSE_KEY }}
          STATE_BUCKET: ${{ vars.CLOUDRU_STATE_BUCKET }}
        run: |
          python3 -m pip install --quiet boto3 cryptography paramiko requests PyYAML
          python3 infra/cloudru/deploy/recover_ui.py prepare
      - name: Validate exact UI-only replacement plan
        id: plan
        env:
          AWS_ACCESS_KEY_ID: ${{ env.SCOPED_S3_ACCESS }}
          AWS_SECRET_ACCESS_KEY: ${{ env.SCOPED_S3_SECRET }}
          AWS_SSE_CUSTOMER_KEY: ${{ env.SCOPED_SSE_KEY }}
          STATE_BUCKET: ${{ vars.CLOUDRU_STATE_BUCKET }}
        run: |
          terraform -chdir=infra/cloudru/deploy validate -no-color
          python3 infra/cloudru/deploy/recover_ui.py plan
      - name: Apply reviewed UI-only plan and retain boot disk
        id: apply
        if: inputs.stage == 'recover'
        working-directory: infra/cloudru/deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ env.SCOPED_S3_ACCESS }}
          AWS_SECRET_ACCESS_KEY: ${{ env.SCOPED_S3_SECRET }}
          AWS_SSE_CUSTOMER_KEY: ${{ env.SCOPED_SSE_KEY }}
          STATE_BUCKET: ${{ vars.CLOUDRU_STATE_BUCKET }}
        run: terraform apply -input=false -auto-approve ui-recovery.tfplan
      - name: Install authenticated UI via native-image SSH
        id: bootstrap
        if: inputs.stage == 'recover' && steps.apply.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ env.SCOPED_S3_ACCESS }}
          AWS_SECRET_ACCESS_KEY: ${{ env.SCOPED_S3_SECRET }}
          AWS_SSE_CUSTOMER_KEY: ${{ env.SCOPED_SSE_KEY }}
          STATE_BUCKET: ${{ vars.CLOUDRU_STATE_BUCKET }}
        run: python3 infra/cloudru/deploy/recover_ui.py bootstrap
      - name: Remove temporary runner SSH access
        if: always() && inputs.stage == 'recover' && steps.prepare.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ env.SCOPED_S3_ACCESS }}
          AWS_SECRET_ACCESS_KEY: ${{ env.SCOPED_S3_SECRET }}
          AWS_SSE_CUSTOMER_KEY: ${{ env.SCOPED_SSE_KEY }}
          STATE_BUCKET: ${{ vars.CLOUDRU_STATE_BUCKET }}
          TF_VAR_deployment_cidr: ""
          TF_VAR_deployment_public_key: ${{ steps.bootstrap.outcome == 'success' && '' || env.TF_VAR_deployment_public_key }}
          BOOTSTRAP_SUCCESS: ${{ steps.bootstrap.outcome == 'success' }}
        run: |
          if [ "$BOOTSTRAP_SUCCESS" = true ]; then export TF_VAR_deployment_public_key=""; fi
          python3 infra/cloudru/deploy/recover_ui.py cleanup-plan
          terraform -chdir=infra/cloudru/deploy apply -input=false -auto-approve ui-cleanup.tfplan
          rm -f "$RUNNER_TEMP/installation-key"
      - name: Verify real UI TLS and authenticated page
        if: inputs.stage == 'recover' && steps.bootstrap.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ env.SCOPED_S3_ACCESS }}
          AWS_SECRET_ACCESS_KEY: ${{ env.SCOPED_S3_SECRET }}
          AWS_SSE_CUSTOMER_KEY: ${{ env.SCOPED_SSE_KEY }}
          STATE_BUCKET: ${{ vars.CLOUDRU_STATE_BUCKET }}
        run: |
          python3 - <<'PY'
          import subprocess,json,time,requests,os,base64,hashlib
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          state=json.loads(subprocess.run(["terraform","state","pull"],cwd="infra/cloudru/deploy",capture_output=True,text=True,check=True).stdout)
          url=state["outputs"]["ui_https_url"]["value"]
          sse=base64.b64decode(os.environ["AWS_SSE_CUSTOMER_KEY"])
          password=AESGCM(hashlib.sha256(b"dmrp-ui-ci-v1"+sse).digest()).decrypt(base64.b64decode("nO4TjZjHfGSWQg3x"),base64.b64decode("Mwg+uEF4R48MQ+5hQ1xojw7EbQXSdlSxtbXsaSsMZHCS+/gKl/rRNxO3gNgF1xRK"),b"dmrp-ui-admin-smoke-v1").decode()
          print("::add-mask::"+password)
          for attempt in range(15):
              try:
                  response=requests.get(url,timeout=15,allow_redirects=False)
                  if response.status_code==401: break
              except requests.RequestException: pass
              print("Waiting for valid TLS and authentication challenge",attempt+1,"/15")
              time.sleep(10)
          else: raise AssertionError("UI TLS/password challenge unavailable")
          response=requests.get(url,auth=("admin",password),timeout=15,allow_redirects=False)
          assert response.status_code==200 and "PROTOTYPE" in response.text
          print("UI_LIVE_PASS: valid TLS, unauthorized HTTP 401, owner admin login, actual HTML page")
          print("Verified UI URL:",url)
          health=requests.get(url+"/api/healthz",auth=("admin",password),timeout=20,allow_redirects=False)
          print("PRIVATE_CORE_HEALTH_HTTP_STATUS",health.status_code)
          if health.status_code==200:
              assert health.json()["postgres_audit_ready"]
              print("PRIVATE_CORE_HEALTH_PASS")
          else:
              raise AssertionError("UI is running, but private core still requires a separately scoped recovery")
          PY
