name: Cloud.ru exact UI read-only boot check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cloudru-ui-inspect.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check only approved UI VM bootstrap state
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          SECRET: ${{ secrets.CLOUDRU_SECRET }}
          SSE: ${{ secrets.CLOUDRU_STATE_SSE_CUSTOMER_KEY }}
        run: |
          python3 -m pip install --quiet boto3 requests
          python3 - <<'PY'
          import os,json,base64,boto3,requests
          from botocore.config import Config
          project="20853297-65b7-42a8-af40-25c8d2df4e11"
          access="fc91c42d-c2ea-4d6d-a236-103fd1f37f00:"+os.environ["KEY_ID"]
          print("::add-mask::"+access)
          sse=base64.b64decode(os.environ["SSE"].strip(),validate=True)
          assert len(sse)==32
          client=boto3.client("s3",endpoint_url="https://s3.cloud.ru",region_name="ru-central-1",aws_access_key_id=access,aws_secret_access_key=os.environ["SECRET"],config=Config(s3={"addressing_style":"path"}))
          state=json.loads(client.get_object(Bucket="test-bucket-ds",Key="terraform/p1/daniil-smirnov.tfstate",SSECustomerAlgorithm="AES256",SSECustomerKey=sse)["Body"].read())
          managed={}
          for resource in state.get("resources",[]):
              if resource["mode"]!="managed": continue
              for instance in resource.get("instances",[]):
                  item=instance["attributes"]
                  if "project_id" in item: assert item["project_id"]==project
                  managed[(resource["type"],resource["name"],instance.get("index_key"))]=item
          ui=managed[("cloudru_evolution_compute_vm","ui_vm",None)]
          assert ui["project_id"]==project and ui["name"]=="dm-p1-ui"
          ip=managed[("cloudru_evolution_compute_external_ip","ui",None)]
          nic=managed[("cloudru_evolution_compute_interface","nic","ui")]
          print("::add-mask::"+ip["ip_address"])
          response=requests.post("https://iam.api.cloud.ru/api/v1/auth/token",json={"keyId":os.environ["KEY_ID"],"secret":os.environ["SECRET"]},timeout=30)
          response.raise_for_status()
          token=response.json()["access_token"]
          print("::add-mask::"+token)
          response=requests.get("https://compute.api.cloud.ru/api/v1/vms/"+ui["id"],headers={"Authorization":"Bearer "+token},timeout=30)
          response.raise_for_status()
          vm=response.json()
          vm=vm.get("vm",vm)
          assert vm["project"]["id"]==project and vm["name"]=="dm-p1-ui"
          print("UI_STATE",vm.get("state"))
          print("UI_AGENT_STATE",vm.get("guest_agent_state"))
          print("UI_API_INTERFACE_MATCH",any(item.get("id")==nic["id"] for item in (vm.get("interfaces") or [])))
          print("UI_STATE_IP_INTERFACE_MATCH",ip.get("network_interface",{}).get("id")==nic["id"])
          print("UI_PUBLIC_API_FIELD_NAMES",sorted(vm.keys()))
          fields=vm.get("metadata_fields") or vm.get("metadata") or []
          if isinstance(fields,list):
              print("UI_METADATA_FIELD_NAMES",[item.get("name") for item in fields if isinstance(item,dict)])
          print("UI_INSPECTION_COMPLETED: no resource changes, resource IDs and addresses withheld")
          PY
