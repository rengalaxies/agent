name: P1 pre-deployment gate (no apply)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/cloudru/deploy/**'
      - 'docs/launch-2026-10/P1-COST-ESTIMATE.md'
      - 'services/demo_api.py'
      - 'ui/**'
      - '.github/workflows/p1-readiness.yml'
permissions:
  contents: read
  issues: write
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assess paid-deployment readiness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path(".")
          tf=(root/"infra/cloudru/deploy/main.tf").read_text()
          ui=(root/"ui/index.html").read_text()
          api=(root/"services/demo_api.py").read_text()
          blockers=[]
          if "disk = 80" not in tf or "disk = 30" not in tf:
              blockers.append("SSD 30/80 GB configuration mismatch")
          if "20853297-65b7-42a8-af40-25c8d2df4e11" not in tf:
              blockers.append("Hard project scope missing")
          if not (root/"infra/cloudru/deploy/P1-PLAN-RESULT.md").exists():
              blockers.append("Plan result missing")
          if 'fetch(\'/api/v1/demo/runs\'' not in ui:
              blockers.append("Live UI-to-V2 interaction missing")
          if "oracles/evaluation" in api or "scenarios/evaluation" in api:
              blockers.append("Evaluation oracle/data isolation violated")
          # Explicitly make human approval and still-needed production safeguards visible.
          blockers += [
            "Persistent encrypted Terraform state backend/locking not configured or integration-tested",
            "Private core egress/NAT provisioning not yet implemented",
            "Real SSH bootstrap keys and restricted CIDR not supplied",
            "Public HTTPS, access controls and domain not provisioned",
            "Database/distributed domain runtime not yet cloud-deployed and verified",
            "Final actual cloud quote, budget approval and manual protected apply gate outstanding",
          ]
          report=["# P1 deployment readiness","**Project:** 20853297-65b7-42a8-af40-25c8d2df4e11",
                  "**Mode:** static preflight; no apply","**Status:** NO-GO pending production safeguards",
                  "", "## Remaining gates"]+[f"- {b}" for b in blockers]
          pathlib.Path("/tmp/readiness.md").write_text(chr(10).join(report))
          PY
          ISSUE=$(gh issue list --repo "$GH_REPO" --state open --json number,title --jq '.[] | select(.title == "[Cloud.ru CI] P1 GO-NOGO") | .number' | head -1)
          if [ -z "$ISSUE" ]; then
            gh issue create --repo "$GH_REPO" --title "[Cloud.ru CI] P1 GO-NOGO" --body-file /tmp/readiness.md
          else
            gh issue edit "$ISSUE" --repo "$GH_REPO" --body-file /tmp/readiness.md
          fi
