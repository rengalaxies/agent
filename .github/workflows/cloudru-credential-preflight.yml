name: Cloud.ru deployment credentials preflight
on:
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudru-credential-preflight.yml'
      - '.github/workflows/cloudru-apply-protected.yml'
permissions:
  contents: read
  issues: write
jobs:
  credential-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check required protected values, without printing values
        env:
          CI_KEY: ${{ secrets.CLOUDRU_KEY_ID }}
          CI_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          TENANT: ${{ vars.CLOUDRU_TENANT_ID }}
          STATE_KEY: ${{ secrets.CLOUDRU_STATE_ACCESS_KEY_ID }}
          STATE_SECRET: ${{ secrets.CLOUDRU_STATE_SECRET_ACCESS_KEY }}
          STATE_SSE: ${{ secrets.CLOUDRU_STATE_SSE_CUSTOMER_KEY }}
          SSH_KEY: ${{ secrets.CLOUDRU_SSH_PUBLIC_KEY }}
          UI_AUTH: ${{ secrets.CLOUDRU_UI_BASIC_AUTH_HASH }}
          STATE_BUCKET: ${{ vars.CLOUDRU_STATE_BUCKET }}
          STATE_ENDPOINT: ${{ vars.CLOUDRU_STATE_S3_ENDPOINT }}
          STATE_REGION: ${{ vars.CLOUDRU_STATE_REGION }}
          ADMIN_CIDR: ${{ vars.CLOUDRU_ADMIN_CIDR }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib,ipaddress,base64
          required={
             "CLOUDRU_KEY_ID":"CI_KEY",
             "CLOUDRU_SECRET":"CI_SECRET",
             "CLOUDRU_STATE_SSE_CUSTOMER_KEY":"STATE_SSE",
             "CLOUDRU_SSH_PUBLIC_KEY":"SSH_KEY",
             "CLOUDRU_UI_BASIC_AUTH_HASH":"UI_AUTH",
             "CLOUDRU_STATE_BUCKET":"STATE_BUCKET",
             "CLOUDRU_ADMIN_CIDR":"ADMIN_CIDR",
          }
          missing=[name for name,env in required.items() if not os.getenv(env)]
          invalid=[]
          state_key=os.getenv("STATE_KEY")
          state_secret=os.getenv("STATE_SECRET")
          if bool(state_key)!=bool(state_secret):
            invalid.append("Dedicated S3 credentials must be configured together")
          elif not state_key:
            if not (os.getenv("CI_KEY") and os.getenv("CI_SECRET") and os.getenv("TENANT")=="fc91c42d-c2ea-4d6d-a236-103fd1f37f00" and os.getenv("STATE_BUCKET")=="test-bucket-ds"):
              missing += ["CLOUDRU_STATE_ACCESS_KEY_ID","CLOUDRU_STATE_SECRET_ACCESS_KEY"]
          sse=os.getenv("STATE_SSE","").strip()
          if sse:
            try:
              if len(base64.b64decode(sse,validate=True))!=32: invalid.append("CLOUDRU_STATE_SSE_CUSTOMER_KEY must encode 32 bytes")
            except ValueError: invalid.append("CLOUDRU_STATE_SSE_CUSTOMER_KEY must be valid base64")
          cidr=os.getenv("ADMIN_CIDR","")
          if cidr:
            try:
              net=ipaddress.ip_network(cidr,strict=False)
              if net.prefixlen<24 or not net.is_global: invalid.append("CLOUDRU_ADMIN_CIDR must be a restricted public network")
            except ValueError: invalid.append("CLOUDRU_ADMIN_CIDR is not a CIDR")
          ssh=os.getenv("SSH_KEY","")
          if ssh and not (ssh.startswith("ssh-ed25519 ") or ssh.startswith("ssh-rsa ")):
            invalid.append("CLOUDRU_SSH_PUBLIC_KEY must be a valid SSH public key")
          ui=os.getenv("UI_AUTH","")
          if ui and not ui.startswith(("$2a$","$2b$","$2y$")):
            invalid.append("CLOUDRU_UI_BASIC_AUTH_HASH must be bcrypt")
          endpoint=os.getenv("STATE_ENDPOINT","")
          if endpoint and not endpoint.startswith("https://"):
            invalid.append("CLOUDRU_STATE_S3_ENDPOINT must use https")
          report={
            "status":"READY_FOR_STATE_TEST" if not missing and not invalid else "CONFIGURATION_REQUIRED",
            "missing":missing, "invalid":invalid, "state_region":os.getenv("STATE_REGION") or "(default)",
            "note":"Secret presence/shape only; bucket ownership, encryption and locking cannot be attested by this test."
          }
          pathlib.Path("/tmp/cloud-preflight.json").write_text(json.dumps(report,ensure_ascii=False))
          print("Credentials presence checked; values never printed")
          PY
      - name: Publish missing-input list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("/tmp/cloud-preflight.json").read_text())
          lines=["# Cloud.ru pre-apply input readiness","**Status:** "+r["status"],
            "**Project:** 20853297-65b7-42a8-af40-25c8d2df4e11",
            "**Run:** ${{ github.run_id }}",
            "**Scope:** checks presence/shape only, not actual API permissions",
            "", "## Missing protected GitHub values"]
          lines += ["- "+v for v in r["missing"]] or ["- None"]
          lines+=["","## Configuration concerns"]
          lines += ["- "+v for v in r["invalid"]] or ["- None"]
          lines += ["","No resources created or paid services called."]
          pathlib.Path("/tmp/cloud-preflight.md").write_text(chr(10).join(lines))
          PY
          TITLE="[Cloud.ru CI] Required deployment inputs"
          ISSUE=$(gh issue list --repo "$GH_REPO" --state open --json number,title --jq '.[] | select(.title == "[Cloud.ru CI] Required deployment inputs") | .number' | head -1)
          if [ -z "$ISSUE" ]; then
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file /tmp/cloud-preflight.md
          else
            gh issue edit "$ISSUE" --repo "$GH_REPO" --body-file /tmp/cloud-preflight.md
          fi
