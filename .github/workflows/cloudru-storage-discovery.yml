name: Inspect managed storage schema
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cloudru-storage-discovery.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public API storage definitions
        run: |
          python3 -u - <<'PY'
          import requests,re,json
          urls=["https://containers.api.cloud.ru/swagger.json","https://containers.api.cloud.ru/openapi.json","https://containers.api.cloud.ru/v2/openapi.json","https://cloud.ru/docs/container-apps-evolution/ug/topics/api__container-apps"]
          for url in urls:
              try:
                  r=requests.get(url,timeout=20)
                  print("PUBLIC_SCHEMA_HTTP",url,r.status_code)
                  if r.ok:
                      if "json" in r.headers.get("Content-Type",""):
                          d=r.json()
                          for name,schema in d.get("components",{}).get("schemas",d.get("definitions",{})).items():
                              if any(x in name.lower() for x in ("volume","s3","bucket")): print("STORAGE_SCHEMA",name,json.dumps(schema))
                      else:
                          matches=re.findall(r'[^\s"<>]{0,200}(?:swagger|openapi|\.ya?ml|\.json)[^\s"<>]{0,200}',r.text)
                          print("PUBLIC_SCHEMA_LINKS",matches[:40])
              except requests.RequestException: print("PUBLIC_SCHEMA_UNAVAILABLE")
          PY
