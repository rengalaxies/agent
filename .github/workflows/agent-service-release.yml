name: agent-service release (publish pinned archive, main only)
# Batch 5B. Builds the pinned Linux release of one accepted main commit twice, requires
# identical archives, publishes it as a GitHub release asset, then downloads the published
# asset by its public URL and verifies sha256 and the manifest. A release tag is never
# overwritten. The cloud box pins url/sha256/name in infra/cloudru/box/release.json through a
# reviewed PR after this run.
on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: "Exact main SHA (40 hex) to release"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: agent-service-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'rengalaxies/agent' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release and upload its assets only
    env:
      EXPECTED: ${{ inputs.expected_main_sha }}
    outputs:
      url: ${{ steps.published.outputs.url }}
      sha: ${{ steps.published.outputs.sha }}
      name: ${{ steps.published.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require the exact main commit
        run: |
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Build environment from the release lock
        run: python -m pip install --disable-pip-version-check --require-hashes -r infra/agent_service/requirements.lock
      - name: Box unit tests
        run: PYTHONPATH=src:. python -m unittest discover -s tools/agent_service/box/tests -t .
      - name: Build twice and require identical archives
        run: |
          python tools/agent_service/box/release.py build --commit "$EXPECTED" --output dist/A > build.json
          python tools/agent_service/box/release.py build --commit "$EXPECTED" --output dist/B > /dev/null
          cmp dist/A/*.tar.gz dist/B/*.tar.gz
          (cd dist/A && sha256sum -c ./*.sha256)
          ARCHIVE=$(basename dist/A/*.tar.gz)
          NAME=${ARCHIVE%.tar.gz}
          TAG=${NAME%-linux-x86_64-cp312}
          SHA=$(sha256sum "dist/A/$ARCHIVE" | cut -d' ' -f1)
          { echo "ARCHIVE=$ARCHIVE"; echo "NAME=$NAME"; echo "TAG=$TAG"; echo "SHA=$SHA"; } >> "$GITHUB_ENV"
      - name: Publish (refuses an existing tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $TAG exists; a release is never replaced"; exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$EXPECTED" --title "$NAME" \
            --notes "Pinned agent-service release of main $EXPECTED. Archive sha256 $SHA. Identity is the archive sha256 plus the commit in manifest.json, not the tag." \
            dist/A/*.tar.gz dist/A/*.manifest.json dist/A/*.sha256
      - name: Download the published asset and verify it
        id: published
        run: |
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/check"
          curl --fail --silent --show-error --location --proto '=https' --retry 5 --retry-all-errors --max-time 300 \
            -o "$RUNNER_TEMP/check/$ARCHIVE" "$URL"
          echo "$SHA  $RUNNER_TEMP/check/$ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/check/$ARCHIVE" -C "$RUNNER_TEMP/check"
          python tools/agent_service/box/release.py verify "$RUNNER_TEMP/check/$NAME" | tee verify.json
          python -c "import json,sys; v=json.load(open('verify.json')); sys.exit(0 if v['status']=='VERIFIED' and v['commit']==sys.argv[1] else 1)" "$EXPECTED"
          { echo "url=$URL"; echo "sha=$SHA"; echo "name=$NAME"; } >> "$GITHUB_OUTPUT"
          {
            echo "## Published release"
            echo "Pin for infra/cloudru/box/release.json:"
            echo '```json'
            printf '{"name": "%s", "sha256": "%s", "url": "%s"}\n' "$NAME" "$SHA" "$URL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  install-published:
    # The published asset, not the build directory: download by URL, check sha256, install it from
    # scratch with systemd and run fresh_install and end_to_end_on_installed_release (comments on the local
    # GitHub and Jira stands, a PR push and a Jira webhook, one comment per resource).
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED: ${{ inputs.expected_main_sha }}
      URL: ${{ needs.release.outputs.url }}
      SHA: ${{ needs.release.outputs.sha }}
      NAME: ${{ needs.release.outputs.name }}
      STAND: /srv/box-stand
      OUT: ${{ github.workspace }}/work/box
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Require the exact main commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Download and extract the published asset as an owner would
        run: |
          mkdir -p "$OUT" /tmp/published
          curl --fail --silent --show-error --location --proto '=https' --retry 5 --retry-all-errors --max-time 300 \
            -o "/tmp/published/$NAME.tar.gz" "$URL"
          echo "$SHA  /tmp/published/$NAME.tar.gz" | sha256sum -c -
          tar -xzf "/tmp/published/$NAME.tar.gz" -C /tmp/published
          echo "REL=/tmp/published/$NAME" >> "$GITHUB_ENV"
      - name: Stand environment from the release lock (stand host only)
        run: python -m pip install --disable-pip-version-check --require-hashes -r infra/agent_service/requirements.lock
      - name: Start the Orders/Reporting stand from the published release
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 "$STAND"
          nohup python "$REL/app/tools/agent_service/box/teststand.py" serve --dir "$STAND" --service-port 8090 \
            > "$OUT/stand.log" 2>&1 &
          for _ in $(seq 1 60); do [ -f "$STAND/stand.json" ] && break; sleep 1; done
          cat "$STAND/stand.json"
          sudo install -D -m 0600 -o root -g root "$STAND/secrets.env" /etc/agent-service/secrets.env
      - name: Fresh install of the published release (systemd)
        run: |
          sudo /usr/bin/python3 "$REL/app/tools/agent_service/box/acceptance.py" --stand "$STAND/stand.json" \
            --release "$REL" --only fresh_install,end_to_end_on_installed_release --output "$OUT/acceptance.json"
      - name: Summary
        if: always()
        run: |
          [ -f "$OUT/acceptance.json" ] || exit 0
          python - "$OUT/acceptance.json" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"### Published release install: {'PASS' if r['passed'] else 'FAIL'} (supervisor {r['supervisor']})")
          for s in r["scenarios"]:
              print(f"- {s['scenario']}: {s['result']} in {s['seconds']} s")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-release-install
          path: work/box
          if-no-files-found: warn
