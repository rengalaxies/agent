name: Published release5fb umask077 qualification
permissions:
  contents: read
jobs:
  install-published:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED: ${{ inputs.expected_main_sha }}
      URL: https://github.com/rengalaxies/agent/releases/download/agent-service-0.1.0-g5fb6484fecff/agent-service-0.1.0-g5fb6484fecff-linux-x86_64-cp312.tar.gz
      SHA: d2ef14de92736095f21e06d938b9311647f9e935fd692e982302a72c9e09706d
      NAME: agent-service-0.1.0-g5fb6484fecff-linux-x86_64-cp312
      STAND: /srv/box-stand
      OUT: ${{ github.workspace }}/work/box
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 5fb6484fecff116d005137f0acaaa81d2d25854c
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Require the exact main commit
      run: test "$(git rev-parse HEAD)" = "$EXPECTED"
    - name: Download and extract the published asset as an owner would
      run: "mkdir -p \"$OUT\" /tmp/published\ncurl --fail --silent --show-error --location\
        \ --proto '=https' --retry 5 --retry-all-errors --max-time 300 \\\n  -o \"\
        /tmp/published/$NAME.tar.gz\" \"$URL\"\necho \"$SHA  /tmp/published/$NAME.tar.gz\"\
        \ | sha256sum -c -\ntar -xzf \"/tmp/published/$NAME.tar.gz\" -C /tmp/published\n\
        echo \"REL=/tmp/published/$NAME\" >> \"$GITHUB_ENV\"\n"
    - name: Stand environment from the release lock (stand host only)
      run: python -m pip install --disable-pip-version-check --require-hashes -r infra/agent_service/requirements.lock
    - name: Start the Orders/Reporting stand from the published release
      run: "sudo install -d -o \"$(id -u)\" -g \"$(id -g)\" -m 0755 \"$STAND\"\nnohup\
        \ python \"$REL/app/tools/agent_service/box/teststand.py\" serve --dir \"\
        $STAND\" --service-port 8090 \\\n  > \"$OUT/stand.log\" 2>&1 &\nfor _ in $(seq\
        \ 1 60); do [ -f \"$STAND/stand.json\" ] && break; sleep 1; done\ncat \"$STAND/stand.json\"\
        \nsudo install -D -m 0600 -o root -g root \"$STAND/secrets.env\" /etc/agent-service/secrets.env\n"
    - name: Fresh install of the published release (systemd)
      run: 'sudo /bin/sh -c ''umask 077; exec /usr/bin/python3 "$1/app/tools/agent_service/box/acceptance.py"
        --stand "$2/stand.json" --release "$1" --only fresh_install,end_to_end_on_installed_release
        --output "$3/acceptance.json"'' sh "$REL" "$STAND" "$OUT"

        sudo -u agent-service test -x /opt/agent-service

        sudo -u agent-service test -x /opt/agent-service/releases

        sudo -u agent-service test -x /etc/agent-service

        sudo /bin/sh -c ''test "$(stat -c %a /etc/agent-service/secrets.env)" = 600''

        '
    - name: Summary
      if: always()
      run: "[ -f \"$OUT/acceptance.json\" ] || exit 0\nsudo /usr/bin/python3 - \"\
        $OUT/acceptance.json\" <<'EOF' | tee -a \"$GITHUB_STEP_SUMMARY\"\nimport json,\
        \ sys\nr = json.load(open(sys.argv[1], encoding=\"utf-8\"))\nprint(f\"###\
        \ Published release install: {'PASS' if r['passed'] else 'FAIL'} (supervisor\
        \ {r['supervisor']})\")\nfor s in r[\"scenarios\"]:\n    print(f\"- {s['scenario']}:\
        \ {s['result']} in {s['seconds']} s\")\nEOF\n"
    - name: Collect runner-owned synthetic acceptance evidence
      if: always()
      run: 'sudo chown -R "$(id -u):$(id -g)" "$OUT"

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: published-release-install
        path: work/box
        if-no-files-found: warn
  recovery-published:
    uses: ./.github/workflows/agent-service-recovery.yml
    with:
      expected_main_sha: ${{ inputs.expected_main_sha }}
      candidate_url: https://github.com/rengalaxies/agent/releases/download/agent-service-0.1.0-g5fb6484fecff/agent-service-0.1.0-g5fb6484fecff-linux-x86_64-cp312.tar.gz
      candidate_sha256: d2ef14de92736095f21e06d938b9311647f9e935fd692e982302a72c9e09706d
'on':
  workflow_dispatch:
    inputs:
      expected_main_sha:
        required: true
        type: string
