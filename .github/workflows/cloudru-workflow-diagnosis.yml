name: Cloud.ru Workflow diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cloudru-workflow-diagnosis.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect approved service without publishing payloads
        env:
          WF_KEY: ${{ secrets.CLOUDRU_WORKFLOW_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,re
          key=os.environ["WF_KEY"].strip()
          assert key, "Workflow API key missing"
          print("::add-mask::"+key)
          base="https://devtools.api.cloud.ru/workflow/v1/project/20853297-65b7-42a8-af40-25c8d2df4e11"
          def get(path):
              req=urllib.request.Request(base+path,headers={"X-API-KEY":key})
              try:
                  with urllib.request.urlopen(req,timeout=35) as r:
                      print("HTTP",path.split("?")[0],r.status)
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  print("HTTP",path.split("?")[0],e.code)
                  return None
          def shape(v):
              if isinstance(v,dict): return {k:shape(x) for k,x in v.items()}
              if isinstance(v,list): return [shape(v[0])] if v else []
              return type(v).__name__
          doc=get("/application/list")
          print("APPLICATION_SCHEMA",json.dumps(shape(doc)))
          def find(v):
              if isinstance(v,dict):
                  if v.get("name")=="dmrp-demo": yield v
                  for x in v.values(): yield from find(x)
              elif isinstance(v,list):
                  for x in v: yield from find(x)
          apps=list(find(doc))
          print("TARGET_MATCHES",len(apps))
          for app in apps:
              aid=app.get("id")
              if not isinstance(aid,str) or not re.fullmatch(r"[0-9a-f-]{36}",aid): continue
              for suffix in ("","/deployment/list"):
                  d=get("/application/"+aid+suffix)
                  print("TARGET_SCHEMA",suffix,json.dumps(shape(d)))
          print("READ_ONLY_COMPLETE")
          PY
