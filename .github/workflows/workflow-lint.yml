name: Workflow security and syntax check
# Runs on every PR that touches a workflow, so a ShellCheck finding (issue #8) fails the PR
# instead of appearing only after merge. The tracking issue is updated from main only.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
permissions:
  contents: read
  issues: write
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -version
      - name: Require ShellCheck
        # actionlint skips run: scripts silently when shellcheck is not on PATH.
        run: shellcheck --version
      - name: Static validate all workflows
        id: lint
        continue-on-error: true
        run: |
          set +e
          ./actionlint -color=false > /tmp/actionlint.txt 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/actionlint.txt
          exit 0
      - name: Publish diagnostics
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ steps.lint.outputs.rc }}
        run: |
          python3 - <<'PY'
          import pathlib,os
          lines=pathlib.Path("/tmp/actionlint.txt").read_text(errors="replace").splitlines()
          report=["# Workflow actionlint","**Result:** "+("PASS" if os.getenv("RESULT")=="0" else "FAIL"),"**Run:** "+os.getenv("GITHUB_RUN_ID",""),"", "## Findings"]+["- "+x[:330] for x in lines[:35]]
          pathlib.Path("/tmp/actionlint-issue.md").write_text(chr(10).join(report))
          PY
          TITLE="[Cloud.ru CI] Workflow lint"
          ISSUE=$(gh issue list --repo "$GH_REPO" --state open --json number,title --jq '.[] | select(.title == "[Cloud.ru CI] Workflow lint") | .number' | head -1)
          if [ -z "$ISSUE" ]; then
            gh issue create --repo "$GH_REPO" --title "$TITLE" --body-file /tmp/actionlint-issue.md
          else
            gh issue edit "$ISSUE" --repo "$GH_REPO" --body-file /tmp/actionlint-issue.md
          fi
      - name: Enforce success
        if: steps.lint.outputs.rc != '0'
        run: exit 1
