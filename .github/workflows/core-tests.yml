name: Core research regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'services/**'
      - 'tests/**'
      - 'scenarios/**'
      - 'oracles/**'
      - 'policies/**'
      - 'contracts/**'
      - 'constitutions/**'
      - 'schemas/**'
      - 'business/**'
      - 'experiments/**'
      - 'examples/**'
      - 'expert/**'
      - 'pyproject.toml'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: '.:src:tests:tools'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[api,test-api,distributed,postgres]'
      - name: Test current implementation without running evaluation E3
        run: python -m unittest discover -s tests -v
