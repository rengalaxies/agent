name: Core research regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'services/**'
      - 'tests/**'
      - 'tools/**'
      - 'stand/**'
      - 'lab/app/**'
      - 'lab/product/**'
      - 'lab/runtime/**'
      - 'scenarios/**'
      - 'oracles/**'
      - 'policies/**'
      - 'contracts/**'
      - 'constitutions/**'
      - 'schemas/**'
      - 'business/**'
      - 'experiments/**'
      - 'examples/**'
      - 'expert/**'
      - 'pyproject.toml'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: '.:src:tests:tools'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[api,test-api,distributed,postgres]'
      - name: Check unused imports and assignments
        run: |
          python -m pip install ruff==0.17.1
          python -m ruff check src services tools stand lab/app lab/product lab/runtime --select F401,F811,F841
      - name: Test current implementation without running evaluation E3
        # ci_unittest.py prints failed tests as ::error annotations (readable without sign-in).
        run: python tests/graph/ci_unittest.py discover -s tests -v
      - name: Batch 2B runner tests (when the branch has them)
        run: |
          if [ -d tools/autonomous_mvp/tests ]; then
            python tests/graph/ci_unittest.py discover -s tools/autonomous_mvp/tests -t . -v
          else
            echo "tools/autonomous_mvp/tests not present on this ref"
          fi
