name: Cloud.ru read-only inventory
on:
  workflow_dispatch:
    inputs:
      reboot_ui:
        description: "Reboot exact approved UI VM for pre-auth SSH diagnosis"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'infra/cloudru/**'
      - '.github/workflows/cloudru-discovery.yml'
permissions:
  contents: write
  issues: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Ensure credentials are configured
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          KEY_SECRET: ${{ secrets.CLOUDRU_SECRET }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$KEY_SECRET" ]; then echo "Missing Cloud.ru GitHub Actions secrets"; exit 1; fi
      - name: Read exact provisioned UI VM status
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          KEY_SECRET: ${{ secrets.CLOUDRU_SECRET }}
          REBOOT_UI: ${{ inputs.reboot_ui }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          body=json.dumps({"keyId":os.environ["KEY_ID"],"secret":os.environ["KEY_SECRET"]}).encode()
          req=urllib.request.Request("https://iam.api.cloud.ru/api/v1/auth/token",data=body,headers={"Content-Type":"application/json"})
          token=json.load(urllib.request.urlopen(req,timeout=30))["access_token"]
          print("::add-mask::"+token)
          req=urllib.request.Request("https://compute.api.cloud.ru/api/v1/vms/1ddaa956-cfeb-4243-8007-1a4b7f715424",headers={"Authorization":"Bearer "+token})
          vm=json.load(urllib.request.urlopen(req,timeout=30))
          vm=vm.get("vm",vm)
          assert vm["project"]["id"]=="20853297-65b7-42a8-af40-25c8d2df4e11" and vm["name"]=="dm-p1-ui"
          if os.environ.get("REBOOT_UI")=="true":
              req=urllib.request.Request("https://compute.api.cloud.ru/api/v1/vms/1ddaa956-cfeb-4243-8007-1a4b7f715424/set-power",data=json.dumps({"state":"reboot"}).encode(),headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
              response=urllib.request.urlopen(req,timeout=30)
              assert response.status in (200,202,204)
              print("Exact approved UI reboot accepted")
              raise SystemExit(0)
          print("Exact UI VM status:",json.dumps({k:vm.get(k) for k in ("name","state","power_state")}))
          print("UI guest agent running:",vm.get("guest_agent_state") in ("running","GUEST_AGENT_STATE_RUNNING"))
          print("UI serial console ready:",bool(vm.get("is_serial_ready")))
          print("UI network interface attached:",bool(vm.get("interfaces")))
          if vm.get("is_serial_ready"):
              req=urllib.request.Request("https://compute.api.cloud.ru/api/v1/vms/1ddaa956-cfeb-4243-8007-1a4b7f715424/remote-console",data=json.dumps({"protocol":"serial"}).encode(),headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
              response=urllib.request.urlopen(req,timeout=30)
              payload=response.read()
              console=json.loads(payload) if payload.strip() else {}
              if not console:
                  req=urllib.request.Request("https://compute.api.cloud.ru/api/v1/vms/1ddaa956-cfeb-4243-8007-1a4b7f715424",headers={"Authorization":"Bearer "+token})
                  console=json.load(urllib.request.urlopen(req,timeout=30))
              print("Serial API response field names:",list(console))
              url=console.get("remote_console_ws") or console.get("remoteConsoleWs") or console.get("url")
              if url:
                  print("::add-mask::"+url)
                  import subprocess
                  subprocess.run(["python3","-m","pip","install","--quiet","websocket-client"],check=True)
                  import websocket,time
                  ws=websocket.create_connection(url,timeout=10)
                  ws.send("\r")
                  frames=[]
                  end=time.time()+10
                  while time.time()<end:
                      try:
                          chunk=ws.recv()
                          frames.append(chunk.decode(errors="replace") if isinstance(chunk,bytes) else chunk)
                      except websocket.WebSocketTimeoutException: break
                  ws.close()
                  text="".join(frames)
                  print("SERIAL login prompt detected:", "login:" in text)
                  print("SERIAL cloud-init failure detected:", "failed" in text.lower() and "cloud-init" in text.lower())
                  print("SERIAL output received:",bool(text))
          PY
      - name: Configure official Cloud.ru provider mirror
        run: |
          cat > "$RUNNER_TEMP/terraform.tfrc" <<'EOF'
          provider_installation {
            network_mirror {
              url     = "https://evo-tf-provider-generic.ar.cloud.ru/"
              include = ["cloudru/*"]
            }
            direct {
              exclude = ["cloudru/*"]
            }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/terraform.tfrc" >> "$GITHUB_ENV"
      - name: Read authorized CPU RAM IP quota totals
        env:
          TF_VAR_auth_key_id: ${{ secrets.CLOUDRU_KEY_ID }}
          TF_VAR_auth_secret: ${{ secrets.CLOUDRU_SECRET }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/quota-check"
          cd "$RUNNER_TEMP/quota-check"
          cat > main.tf <<'EOF'
          terraform {
           required_providers { cloudru = { source = "cloudru/cloud", version = "2.1.3" } }
          }
          variable "auth_key_id" {
           type = string
           sensitive = true
          }
          variable "auth_secret" {
           type = string
           sensitive = true
          }
          provider "cloudru" {
           project_id = "20853297-65b7-42a8-af40-25c8d2df4e11"
           auth_key_id = var.auth_key_id
           auth_secret = var.auth_secret
           endpoints = { iam_endpoint = "iam.api.cloud.ru:443", cloud_platform_endpoint = "organization.api.cloud.ru:443" }
          }
          data "cloudru_evolution_organization_project_collection" "approved" {
           project_ids = ["20853297-65b7-42a8-af40-25c8d2df4e11"]
           page_size = 1
          }
          data "cloudru_evolution_organization_quota_usage_collection" "organization" {
           subject_type_codes = ["QUOTA_SUBJECT_TYPE_CUSTOMER"]
           subject_ids = [data.cloudru_evolution_organization_project_collection.approved.projects[0].customer_id]
           page_size = 100
          }
          data "cloudru_evolution_organization_quota_usage_collection" "project" {
           subject_type_codes = ["QUOTA_SUBJECT_TYPE_PROJECT"]
           subject_ids = ["20853297-65b7-42a8-af40-25c8d2df4e11"]
           page_size = 100
          }
          output "quota_totals" {
           sensitive = true
           value = {
           organization = data.cloudru_evolution_organization_quota_usage_collection.organization.usages
           project = data.cloudru_evolution_organization_quota_usage_collection.project.usages
           }
          }
          EOF
          terraform init -input=false -no-color > /tmp/quota-init.log 2>&1 || { cat /tmp/quota-init.log; exit 1; }
          terraform plan -input=false -no-color -out=quota.plan > /tmp/quota-plan.log 2>&1 || { tail -30 /tmp/quota-plan.log; exit 1; }
          terraform show -json quota.plan > quota.json
          python3 - <<'PY'
          import json
          q=json.load(open("quota.json"))["planned_values"]["outputs"]["quota_totals"]["value"]
          for scope,rows in q.items():
              for row in rows or []:
                  code=row["resource_type_code"]
                  if any(x in code.lower() for x in ("vcpu","cpu","ram","memory","network.ip")):
                      print("QUOTA",scope,json.dumps({k:row.get(k) for k in ("resource_type_code","individual_limit","individual_usage","aggregated_usage")}))
          print("QUOTA_READ_COMPLETE", {k:len(v or []) for k,v in q.items()})
          PY
      - name: Read-only Terraform inventory
        working-directory: infra/cloudru
        env:
          TF_VAR_project_id: "20853297-65b7-42a8-af40-25c8d2df4e11"
          TF_VAR_auth_key_id: ${{ secrets.CLOUDRU_KEY_ID }}
          TF_VAR_auth_secret: ${{ secrets.CLOUDRU_SECRET }}
        run: |
          terraform init -input=false
          terraform validate -no-color
          terraform plan -input=false -lock=false -out=inventory.tfplan
          terraform show -json inventory.tfplan > /tmp/cloudru-plan.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cloudru-plan.json'))
          out=d.get('planned_values',{}).get('outputs',{})
          approved="20853297-65b7-42a8-af40-25c8d2df4e11"
          inventory=out.get("scoped_inventory",{}).get("value")
          if inventory is None:
              raise SystemExit("Scoped inventory unresolved - inspect plan")
          if inventory.get("project_id") != approved:
              raise SystemExit("ERROR: project ID mismatch")
          for category in ("vms","disks","ips","subnets","nat_gateways"):
              entries=inventory.get(category) or []
              for item in entries:
                  if item.get("project_id",approved)!=approved:
                      raise SystemExit("ERROR: unexpected project resource")
              print(category.upper(),len(entries),json.dumps(entries,ensure_ascii=False))
          print("Verified inventory scope:",approved)
          # Public repo: publish counts only, never resource IDs or addresses.
          import pathlib
          report = {
              "project_id": approved,
              "status": "read_only_inventory_succeeded",
              "run_id": "${{ github.run_id }}",
              "counts": {k: len(inventory.get(k) or []) for k in ("vms","disks","ips","subnets","nat_gateways")},
              "vpc_collection_status": "not_queried_dns_issue"
          }
          path=pathlib.Path("../../docs/launch-2026-10/cloudru-inventory-latest.json")
          path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+chr(10))
          candidate = out.get("deployment_candidates",{}).get("value")
          if candidate is None:
              raise SystemExit("No deployment_candidates output found in Terraform plan")
          if candidate.get("project_id") != approved:
              raise SystemExit("Candidate project mismatch")
          safe={
              "project_id": approved,
              "flavors": candidate.get("flavors") or [],
              "ubuntu_images": [i for i in (candidate.get("images") or []) if i.get("name","").lower() in ("ubuntu-24.04","ubuntu-22.04")],
              "source_run_id": "${{ github.run_id }}"
          }
          pathlib.Path("../../docs/launch-2026-10/cloudru-candidates-latest.json").write_text(json.dumps(safe,ensure_ascii=False,indent=2)+chr(10))
          print("Safe candidates: flavors",len(safe["flavors"]),"ubuntu",len(safe["ubuntu_images"]))
          PY
      - name: Publish sanitized inventory summary
        run: |
          git config user.name "cloudru-inventory-bot"
          git config user.email "cloudru-inventory-bot@users.noreply.github.com"
          git add docs/launch-2026-10/cloudru-inventory-latest.json docs/launch-2026-10/cloudru-candidates-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: update Cloud.ru inventory summary [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish discovery status to Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import pathlib,json
          inventory=pathlib.Path("docs/launch-2026-10/cloudru-inventory-latest.json")
          candidates=pathlib.Path("docs/launch-2026-10/cloudru-candidates-latest.json")
          counts={}
          if inventory.exists():
              try: counts=json.loads(inventory.read_text()).get("counts",{})
              except Exception: pass
          lines=[
            "# Cloud.ru read-only discovery",
            "**Allowed project:** 20853297-65b7-42a8-af40-25c8d2df4e11",
            "**Run:** ${{ github.run_id }}",
            "**Commit:** ${{ github.sha }}",
            "**VM/disk/IP/subnet/NAT counts:** "+str(counts),
            "**Candidate flavor/image report:** "+("available" if candidates.exists() else "missing - review discovery step"),
            "",
            "This workflow cannot create or modify Cloud.ru resources."
          ]
          pathlib.Path("/tmp/discovery-status.md").write_text(chr(10).join(lines))
          PY
          ISSUE=$(gh issue list --repo "$GH_REPO" --state open --json number,title --jq '.[] | select(.title == "[Cloud.ru CI] Discovery status") | .number' | head -1)
          if [ -z "$ISSUE" ]; then
            gh issue create --repo "$GH_REPO" --title "[Cloud.ru CI] Discovery status" --body-file /tmp/discovery-status.md
          else
            gh issue edit "$ISSUE" --repo "$GH_REPO" --body-file /tmp/discovery-status.md
          fi
