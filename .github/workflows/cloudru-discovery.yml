name: Cloud.ru read-only inventory
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Ensure credentials are configured
        env:
          KEY_ID: ${{ secrets.CLOUDRU_KEY_ID }}
          KEY_SECRET: ${{ secrets.CLOUDRU_SECRET }}
        run: |
          test -n "$KEY_ID" && test -n "$KEY_SECRET" || { echo "Missing Cloud.ru GitHub Actions secrets"; exit 1; }
      - name: Configure official Cloud.ru provider mirror
        run: |
          cat > "$RUNNER_TEMP/terraform.tfrc" <<'EOF'
          provider_installation {
            network_mirror {
              url     = "https://evo-tf-provider-generic.ar.cloud.ru/"
              include = ["cloudru/*"]
            }
            direct {
              exclude = ["cloudru/*"]
            }
          }
          EOF
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/terraform.tfrc" >> "$GITHUB_ENV"
      - name: Read-only Terraform inventory
        working-directory: infra/cloudru
        env:
          TF_VAR_project_id: "20853297-65b7-42a8-af40-25c8d2df4e11"
          TF_VAR_auth_key_id: ${{ secrets.CLOUDRU_KEY_ID }}
          TF_VAR_auth_secret: ${{ secrets.CLOUDRU_SECRET }}
        run: |
          terraform init -input=false
          terraform validate -no-color
          terraform plan -input=false -lock=false -out=inventory.tfplan
          terraform show -json inventory.tfplan > /tmp/cloudru-plan.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cloudru-plan.json'))
          out=d.get('planned_values',{}).get('outputs',{})
          approved="20853297-65b7-42a8-af40-25c8d2df4e11"
          inventory=out.get("scoped_inventory",{}).get("value")
          if inventory is None:
              raise SystemExit("Scoped inventory unresolved - inspect plan")
          if inventory.get("project_id") != approved:
              raise SystemExit("ERROR: project ID mismatch")
          for category in ("vms","disks","ips","subnets","vpcs","nat_gateways"):
              entries=inventory.get(category) or []
              for item in entries:
                  if item.get("project_id",approved)!=approved:
                      raise SystemExit("ERROR: unexpected project resource")
              print(category.upper(),len(entries),json.dumps(entries,ensure_ascii=False))
          print("Verified inventory scope:",approved)
          PY
