name: agent-service exact release recovery
on:
  pull_request:
    paths:
      - 'src/agent_graph/**'
      - 'src/agent_service/**'
      - 'tools/agent_service/box/**'
      - 'infra/agent_service/**'
      - '.github/workflows/agent-service-recovery.yml'
      - '.github/workflows/agent-service-release.yml'
  workflow_call:
    inputs:
      expected_main_sha:
        required: true
        type: string
      candidate_url:
        required: true
        type: string
      candidate_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED: ${{ inputs.expected_main_sha || github.event.pull_request.head.sha || github.sha }}
      CANDIDATE_URL: ${{ inputs.candidate_url }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha256 }}
      STAND: /srv/box-recovery-stand
      OUT: ${{ github.workspace }}/work/recovery
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_main_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact source and unit regressions
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          mkdir -p "$OUT" /tmp/recovery-old /tmp/recovery-new
          python -m pip install --disable-pip-version-check --require-hashes -r infra/agent_service/requirements.lock
          PYTHONPATH=.:src python -m unittest discover -s tools/agent_service/box/tests -t . -v
      - name: Download real published release14e (never rebuilt or patched)
        run: |
          curl --fail --silent --show-error --location --proto '=https' --retry 5 --max-time 300 \
            -o /tmp/old.tar.gz https://github.com/rengalaxies/agent/releases/download/agent-service-0.1.0-g14e65e8affe3/agent-service-0.1.0-g14e65e8affe3-linux-x86_64-cp312.tar.gz
          echo '95648b846da2dd8fbdfdf76942d1c9563bc4be5d3f2cbfad3987ec3eade8a013  /tmp/old.tar.gz' | sha256sum -c -
          tar -xzf /tmp/old.tar.gz -C /tmp/recovery-old
          echo "OLD=$(find /tmp/recovery-old -mindepth 1 -maxdepth 1 -type d)" >> "$GITHUB_ENV"
          python tools/agent_service/box/release.py verify /tmp/recovery-old/agent-service-* | tee "$OUT/old-verify.json"
      - name: Build exact candidate twice or download the exact published candidate
        run: |
          if [ -n "$CANDIDATE_URL" ]; then
            [[ "$CANDIDATE_URL" == https://github.com/rengalaxies/agent/releases/download/* ]]
            [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{64}$ ]]
            curl --fail --silent --show-error --location --proto '=https' --retry 5 --max-time 300 \
              -o /tmp/candidate.tar.gz "$CANDIDATE_URL"
            echo "$CANDIDATE_SHA  /tmp/candidate.tar.gz" | sha256sum -c -
            sha256sum /tmp/candidate.tar.gz > "$OUT/downloaded-candidate.sha256"
            tar -xzf /tmp/candidate.tar.gz -C /tmp/recovery-new
          else
            python tools/agent_service/box/release.py build --commit "$EXPECTED" --output dist/A > "$OUT/build.json"
            python tools/agent_service/box/release.py build --commit "$EXPECTED" --output dist/B > /dev/null
            cmp dist/A/*.tar.gz dist/B/*.tar.gz
            (cd dist/A && sha256sum -c ./*.sha256)
            cp dist/A/*.manifest.json dist/A/*.sha256 "$OUT/"
            tar -xzf dist/A/*.tar.gz -C /tmp/recovery-new
          fi
          NEW=$(find /tmp/recovery-new -mindepth 1 -maxdepth 1 -type d)
          echo "NEW=$NEW" >> "$GITHUB_ENV"
          python tools/agent_service/box/release.py verify "$NEW" | tee "$OUT/new-verify.json"
          python -c 'import json,sys; assert json.load(open(sys.argv[1]))["commit"]==sys.argv[2]' "$OUT/new-verify.json" "$EXPECTED"
      - name: Start local HTTP stands
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 "$STAND"
          nohup python tools/agent_service/box/teststand.py serve --dir "$STAND" --service-port 8090 \
            > /tmp/recovery-stand.log 2>&1 &
          for _ in $(seq 1 60); do [ -f "$STAND/stand.json" ] && break; sleep 1; done
          sudo install -D -m 0600 -o root -g root "$STAND/secrets.env" /etc/agent-service/secrets.env
      - name: Actual release14e to candidate to restored release14e to candidate (systemd)
        run: |
          sudo /usr/bin/python3 tools/agent_service/box/recovery_acceptance.py \
            --stand "$STAND/stand.json" --release "$OLD" --candidate "$NEW" --output "$OUT/acceptance.json"
      - name: Stop local service
        if: always()
        run: sudo systemctl stop agent-service.service || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-release-recovery-${{ inputs.expected_main_sha || github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          path: work/recovery
          if-no-files-found: warn
