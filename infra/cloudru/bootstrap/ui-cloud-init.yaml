#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - git
  - docker.io
write_files:
  - path: /etc/systemd/system/dmrp-ui.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Data Mesh Interview UI - HTTP staging only
      Wants=network-online.target docker.service
      After=network-online.target docker.service
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/dmrp-ui-start
      ExecStop=/usr/bin/docker stop dmrp-ui
      TimeoutStartSec=360
      [Install]
      WantedBy=multi-user.target
  - path: /usr/local/sbin/dmrp-ui-start
    permissions: '0700'
    content: |
      #!/bin/sh
      set -eu
      if [ ! -d /opt/dmrp/.git ]; then
        git clone --depth=1 https://github.com/rengalaxies/agent.git /opt/dmrp
      fi
      cd /opt/dmrp
      git fetch --depth=1 origin ${git_ref}
      git checkout --detach ${git_ref}
      docker build -f ui/Dockerfile -t dmrp-ui:local .
      docker rm -f dmrp-ui 2>/dev/null || true
      docker run -d --name dmrp-ui --restart unless-stopped --read-only \
        --tmpfs /var/cache/nginx:rw,nosuid,nodev --tmpfs /var/run:rw,nosuid,nodev \
        --tmpfs /tmp:rw,nosuid,nodev --security-opt no-new-privileges \
        --cap-drop ALL -e CORE_PRIVATE_IP=${core_ip} -p 127.0.0.1:8080:8080 dmrp-ui:local
runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, docker]
  - [systemctl, enable, --now, dmrp-ui.service]
