name: agent-graph-demo
services:
  web:
    image: ${DEMO_IMAGE:?immutable release image required}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    ports: ["127.0.0.1:18081:18081"]
    volumes:
      - /var/lib/agent-graph-demo/state:/var/lib/agent-graph-demo/state
      - /var/lib/agent-graph-demo/runtime:/var/lib/agent-graph-demo/runtime:ro
      - /etc/agent-graph-demo:/etc/demo:ro
      - ${DEMO_CORE_ROOT:?separate pinned core checkout required}:/core:ro
    tmpfs: [/tmp:size=32m]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
