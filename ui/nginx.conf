limit_req_zone $binary_remote_addr zone=demo_api_rate:10m rate=5r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }
    location = /api/healthz {
        proxy_pass http://${CORE_PRIVATE_IP}:8000/healthz;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location /api/v1/ {
        limit_req zone=demo_api_rate burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        client_body_timeout 8s;
        proxy_pass http://${CORE_PRIVATE_IP}:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }
}
